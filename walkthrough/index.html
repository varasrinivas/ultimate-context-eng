<style>/* Walkthrough widget styles. EVERY rule is scoped under .wt so this file can be
   inlined into a course page without colliding with the host's own CSS (the
   course players already define .stamp, .step-card, table, pre, p, h3 …).
   Ported from priorauth-sdd-course/walkthrough/src/app.css, plus the receipt,
   bars, window and tab views these courses need.

   Two palettes: the default light "paper" one (kit-format players, SDD guide)
   and .wt-dark for the knowledge-graph modules, whose pages are dark navy.
   Set it per mount with data-wt-theme="dark". */

.wt{
  --paper:#FAFBFC; --sheet:#FFFFFF; --ink:#1C2127; --ink-soft:#4A5361;
  --rule:#D9DEE5; --rule-soft:#EAEDF1;
  --grid-blue:#33506B; --spec-green:#1F7A4D; --spec-green-soft:#E8F3ED;
  --signal-amber:#B45309; --signal-amber-soft:#FCF1E4;
  --defect-red:#A63A3A; --defect-red-soft:#F9ECEC;
  --term-bg:#161B22; --code-bg:#F4F6F9;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  font-family:var(--sans);color:var(--ink);line-height:1.6;font-size:16px;text-align:left;
}
.wt.wt-dark{
  --paper:#0F1A2B; --sheet:#162033; --ink:#E8ECF1; --ink-soft:#94A3B8;
  --rule:#2A3648; --rule-soft:#212C3D;
  --grid-blue:#7FB2E8; --spec-green:#5FCB93; --spec-green-soft:#12301F;
  --signal-amber:#E0A458; --signal-amber-soft:#2E2214;
  --defect-red:#E58989; --defect-red-soft:#331B1B;
  --term-bg:#0B1220; --code-bg:#101A2A;
}
.wt *{margin:0;padding:0;box-sizing:border-box}
.wt button{font-family:inherit;cursor:pointer}
.wt a{color:var(--grid-blue)}
.wt code{font-family:var(--mono);font-size:.88em;background:var(--rule-soft);padding:.1em .35em;border-radius:3px;color:inherit}
/* neutralise the host page's element styles before our own rules land */
.wt pre{background:transparent;color:inherit;border-radius:0;font-size:inherit;line-height:inherit;overflow:visible;border:none;margin:0;padding:0}
.wt table{border-collapse:collapse;background:transparent;font-size:inherit;margin:0;width:auto}
.wt h2,.wt h3{font-family:var(--sans);letter-spacing:-.01em;line-height:1.25;color:var(--ink);border:none;padding:0}
.wt p{color:var(--ink)}
.wt :focus-visible{outline:2px solid var(--grid-blue);outline-offset:2px}

/* ---------- scenario head (standalone) ---------- */
.wt .scen-head{border-left:4px solid var(--scen-color);padding-left:18px;margin-bottom:22px}
.wt .scen-meta{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:.72rem;flex-wrap:wrap}
.wt .scen-badge{background:var(--scen-color);color:#fff;padding:2px 10px;border-radius:3px;letter-spacing:.1em;font-weight:600}
.wt .scen-spec{color:var(--ink-soft);letter-spacing:.06em}
.wt .scen-head h2{font-size:1.45rem;margin:6px 0}
.wt .scen-intro{color:var(--ink-soft);max-width:80ch;font-family:var(--serif)}

/* ---------- provenance ---------- */
.wt .wt-prov{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.1em;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;color:var(--ink-soft)}
.wt .wt-prov-measured .wt-prov-k{color:var(--spec-green);font-weight:600}
.wt .wt-prov-illustrative .wt-prov-k{color:var(--signal-amber);font-weight:600}
.wt .wt-prov-v{opacity:.8;text-transform:none;letter-spacing:0}

/* ---------- progress ---------- */
.wt .progress{display:flex;align-items:center;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.wt .prog-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);background:var(--sheet);
  font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--ink-soft);transition:all .25s;
  display:flex;align-items:center;justify-content:center;padding:0}
.wt .prog-dot.done{border-color:var(--spec-green);color:var(--spec-green);background:var(--spec-green-soft)}
.wt .prog-dot.on{border-color:var(--scen-color);background:var(--scen-color);color:#fff;transform:scale(1.12)}
.wt .prog-label{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft);margin-left:6px}

/* ---------- step ---------- */
.wt .step{display:grid;grid-template-columns:minmax(320px,5fr) minmax(380px,7fr);gap:26px;
  animation:wtStepIn .35s ease both}
.wt.wt-embed .step{grid-template-columns:1fr;gap:18px}
@keyframes wtStepIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){.wt .step{grid-template-columns:1fr}}

.wt .step-copy h3{font-size:1.15rem;margin-bottom:12px;font-weight:700}
.wt .step-n{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--grid-blue);margin-bottom:2px}
.wt .step-copy p{margin-bottom:12px;max-width:66ch;font-size:.95rem}
.wt .step-copy p b{font-weight:600}

.wt .youdo,.wt .claudesays{border:1px solid var(--rule);border-left:3px solid var(--signal-amber);
  background:var(--signal-amber-soft);padding:12px 16px;margin:14px 0;border-radius:0 6px 6px 0}
.wt .claudesays{border-left-color:var(--grid-blue);background:var(--rule-soft)}
.wt .youdo-k{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;font-weight:600;
  color:var(--signal-amber);margin-bottom:4px}
.wt .cs-k{color:var(--grid-blue)}
.wt .youdo-v{font-size:.92rem}

/* ---------- terminal ---------- */
.wt .term{background:var(--term-bg);border-radius:10px;overflow:hidden;
  box-shadow:0 10px 30px rgba(16,22,30,.25);margin-bottom:20px}
.wt .term-bar{display:flex;align-items:center;gap:12px;background:#0D1117;padding:9px 14px}
.wt .term-dots{display:flex;gap:6px}
.wt .term-dots i{width:11px;height:11px;border-radius:50%;background:#30363D;display:block}
.wt .term-dots i:first-child{background:#E5534B}
.wt .term-dots i:nth-child(2){background:#D4A72C}
.wt .term-dots i:last-child{background:#3FB950}
.wt .term-title{font-family:var(--mono);font-size:.72rem;color:#8A97A6;flex:1}
.wt .term-actions button{background:none;border:1px solid #30363D;color:#8A97A6;font-family:var(--mono);
  font-size:.66rem;padding:2px 10px;border-radius:99px}
.wt .term-actions button:hover{color:#E8ECF0;border-color:#8A97A6}
.wt .term-body{padding:16px 18px;max-height:460px;overflow-y:auto;font-family:var(--mono);
  font-size:.8rem;line-height:1.55}
.wt .tl{display:flex;gap:10px;margin-bottom:10px}
.wt .tl pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;flex:1;font-size:inherit;line-height:inherit}
.wt .tl-appear{animation:wtTlIn .3s ease both}
@keyframes wtTlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wt .tl-prompt pre{color:#F0F3F6;font-weight:500}
.wt .tl-caret{color:#7FD6A8;font-weight:600}
.wt .tl-who{color:#D4A843}
.wt .tl-who-tool{color:#9BC0E8}
.wt .tl-claude pre{color:#C6CEDA}
.wt .tl-tool pre{color:#9BC0E8}
.wt .tl-out pre{color:#8A97A6}
.wt .tl-out-pass pre{color:#7FD6A8;font-weight:500}
.wt .tl-out-fail pre{color:#F1A0A0;font-weight:500}
.wt .tl-gate pre{color:#F1C58B;font-weight:600}
.wt .cursor{display:inline-block;width:7px;height:14px;background:#7FD6A8;vertical-align:-2px;
  animation:wtBlink .8s steps(1) infinite;margin-left:1px}
@keyframes wtBlink{50%{opacity:0}}

/* ---------- state panel ---------- */
.wt .state{background:var(--sheet);border:1px solid var(--ink);box-shadow:4px 4px 0 var(--rule);border-radius:2px}
.wt.wt-dark .state{border-color:var(--rule);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.wt .state-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--ink);color:var(--sheet);padding:8px 14px}
.wt.wt-dark .state-head{background:#0B1220;color:var(--ink)}
.wt .state-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em}
.wt .ba-toggle{display:flex;border:1px solid #4A5361;border-radius:99px;overflow:hidden;flex:0 0 auto}
.wt .ba-toggle button{background:none;border:none;color:#8A97A6;font-family:var(--mono);font-size:.68rem;
  letter-spacing:.08em;padding:3px 14px}
.wt .ba-toggle button.on{background:var(--defect-red);color:#fff}
.wt .ba-toggle button.on-after{background:var(--spec-green);color:#fff}
.wt .state-body{padding:16px 18px;animation:wtStateIn .3s ease both}
@keyframes wtStateIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.wt .state-title{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;margin-bottom:10px;font-weight:600}
.wt .st-before{color:var(--defect-red)}
.wt .st-after{color:var(--spec-green)}
.wt .apply{display:block;width:100%;border:none;border-top:1px dashed var(--rule);
  background:var(--spec-green-soft);color:var(--spec-green);font-family:var(--mono);font-size:.74rem;
  font-weight:600;padding:10px;letter-spacing:.04em}
.wt .apply:hover{filter:brightness(.97)}
.wt .state-note{font-size:.88rem;color:var(--ink-soft);font-family:var(--serif)}
.wt .state-stack>div{margin-bottom:14px}
.wt .state-stack>div:last-child{margin-bottom:0}

/* json */
.wt .json{font-family:var(--mono);font-size:.78rem;line-height:1.6;background:var(--code-bg);
  border:1px solid var(--rule-soft);border-radius:6px;padding:12px 14px;overflow-x:auto;color:var(--ink)}
.wt .json-row.hl{background:var(--signal-amber-soft);outline:1px solid var(--signal-amber);
  border-radius:3px;animation:wtHl 1.2s ease 1}
@keyframes wtHl{0%{opacity:.45}100%{opacity:1}}
.wt .jk{color:var(--grid-blue)}
.wt .js{color:var(--defect-red)}
.wt .jn{color:var(--spec-green)}

/* spec mini */
.wt .spec-mini{border:1px solid var(--ink);font-size:.85rem}
.wt.wt-dark .spec-mini{border-color:var(--rule)}
.wt .spec-mini-bar{display:flex;justify-content:space-between;align-items:center;background:var(--ink);
  color:var(--sheet);padding:7px 12px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;gap:10px}
.wt.wt-dark .spec-mini-bar{background:#0B1220;color:var(--ink)}
.wt .stamp{font-family:var(--mono);font-weight:600;font-size:.62rem;letter-spacing:.12em;
  border:1.5px solid currentColor;padding:2px 8px;border-radius:2px;white-space:nowrap;
  animation:wtStamp .45s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
@keyframes wtStamp{from{transform:scale(1.7) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.wt .stamp-approved,.wt .stamp-verified{color:#7FD6A8}
.wt .stamp-draft{color:#F1C58B}
.wt .stamp-defect,.wt .stamp-refused{color:#F1A0A0}
.wt .spec-mini-body{padding:6px 12px}
.wt .spec-mini-row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--rule-soft);font-size:.8rem}
.wt .spec-mini-row:last-child{border-bottom:none}
.wt .smk{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);padding-top:2px}

/* rows table */
.wt .rows{width:100%;font-size:.78rem}
.wt .rows th{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  text-align:left;color:var(--ink-soft);border-bottom:2px solid var(--ink);padding:6px 8px;background:transparent}
.wt.wt-dark .rows th{border-bottom-color:var(--rule)}
.wt .rows td{padding:6px 8px;border-bottom:1px solid var(--rule-soft);font-family:var(--mono);
  font-size:.74rem;color:var(--ink)}
.wt .row-new td{background:var(--spec-green-soft);animation:wtRowIn .6s ease both}
.wt .row-new td:first-child{border-left:3px solid var(--spec-green)}
.wt .row-win td{background:var(--spec-green-soft)}
.wt .row-bad td{background:var(--defect-red-soft)}
@keyframes wtRowIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* diff */
.wt .diff{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.wt .diff-file{font-family:var(--mono);font-size:.68rem;background:var(--rule-soft);padding:6px 12px;color:var(--ink-soft)}
.wt .diff pre{font-family:var(--mono);font-size:.76rem;line-height:1.6;padding:10px 0;overflow-x:auto;color:var(--ink)}
.wt .dl{padding:0 14px;white-space:pre}
.wt .dl-p{color:var(--ink-soft)}
.wt .dl-m{background:var(--defect-red-soft);color:var(--defect-red)}
.wt .dl-a{background:var(--spec-green-soft);color:var(--spec-green)}

/* tests */
.wt .tests{border-radius:8px;padding:16px 18px;text-align:center}
.wt .tests-fail{background:var(--defect-red-soft);border:1px solid var(--defect-red)}
.wt .tests-pass{background:var(--spec-green-soft);border:1px solid var(--spec-green);
  animation:wtPass .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes wtPass{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.wt .tests-big{font-family:var(--mono);font-weight:600;font-size:1rem;letter-spacing:.08em}
.wt .tests-fail .tests-big{color:var(--defect-red)}
.wt .tests-pass .tests-big{color:var(--spec-green)}
.wt .tests-nums{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft);margin-top:4px}
.wt .tests-note{font-size:.8rem;color:var(--ink-soft);margin-top:8px;font-family:var(--serif)}

/* ---------- receipt (Token Lens) ---------- */
.wt .receipt{font-family:var(--mono);font-size:.78rem}
.wt .rc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.wt .rc-mode{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.wt .rc-q{font-size:.68rem;color:var(--ink-soft);font-style:italic;max-width:32ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .lbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--rule-soft);margin-bottom:12px}
.wt .lseg{height:100%;transition:width .5s ease}
.wt .lseg-hl{outline:2px solid var(--ink);outline-offset:-2px}
.wt .rc-lines{margin-bottom:6px}
.wt .rc-line{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.wt .rc-line.hl{background:var(--signal-amber-soft);border-radius:3px;margin:0 -6px;padding:3px 6px}
.wt .rc-sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto;display:inline-block}
.wt .rc-k{color:var(--ink-soft)}
.wt .rc-dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
.wt .rc-v{font-variant-numeric:tabular-nums;color:var(--ink)}
.wt .rc-total{display:flex;align-items:baseline;gap:8px;padding:7px 0 3px;margin-top:4px;
  border-top:1px solid var(--rule);font-weight:600}
.wt .rc-total .rc-k,.wt .rc-total .rc-v{color:var(--ink)}
.wt .rc-sub .rc-k,.wt .rc-sub .rc-v{opacity:.75}
.wt .rc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wt .rc-chip{font-size:.64rem;letter-spacing:.04em;border:1px solid var(--rule);border-radius:99px;
  padding:2px 9px;color:var(--ink-soft)}
.wt .rc-verdict{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wt .rcv-note{font-size:.68rem;color:var(--ink-soft)}
.wt .rcv-failed{background:var(--defect-red-soft);margin:12px -18px -16px;padding:10px 18px;border-top:1px solid var(--defect-red)}

/* ---------- bars (comparative totals) ---------- */
.wt .bars{font-family:var(--mono);font-size:.76rem}
.wt .bars-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.wt .bars-row:last-child{border-bottom:none}
.wt .bars-k{color:var(--ink-soft);letter-spacing:.04em}
.wt .bars-track{background:var(--rule-soft);border-radius:3px;height:14px;overflow:hidden}
.wt .bars-fill{height:100%;background:var(--grid-blue);border-radius:3px;transition:width .6s ease}
.wt .bt-win .bars-fill{background:var(--spec-green)}
.wt .bt-bad .bars-fill{background:var(--defect-red)}
.wt .bt-win .bars-k{color:var(--spec-green);font-weight:600}
.wt .bt-bad .bars-k{color:var(--defect-red)}
.wt .bars-v{font-variant-numeric:tabular-nums;color:var(--ink)}
.wt .bars-note{grid-column:2/4;font-size:.68rem;color:var(--ink-soft);margin-top:-2px}

/* ---------- window (context window capacity) ---------- */
.wt .cwin{font-family:var(--mono);font-size:.76rem}
.wt .cwin-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.wt .cwin-k{color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;font-size:.66rem}
.wt .cwin-v{color:var(--ink);font-variant-numeric:tabular-nums}
.wt .cwin-track{background:var(--rule-soft);border:1px solid var(--rule);border-radius:5px;
  height:22px;overflow:hidden;padding:2px}
.wt .cwin-used{height:100%;transition:width .6s ease;min-width:2px}
.wt .cwin-used .lbar{height:100%;margin:0;border-radius:3px}
.wt .cwin-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.68rem;color:var(--ink-soft)}
.wt .cwin-item{display:inline-flex;align-items:center;gap:5px}
.wt .cwin-item.hl{color:var(--ink);font-weight:600}
.wt .cwin-note{margin-top:10px;font-family:var(--serif);font-size:.82rem;color:var(--ink-soft)}

/* per-step source citation */
.wt .wt-cite{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);
  font-size:.64rem;color:var(--ink-soft);letter-spacing:.02em;flex-wrap:wrap}
.wt .wt-cite-k{color:var(--spec-green);font-weight:600;letter-spacing:.12em;
  border:1px solid var(--spec-green);border-radius:99px;padding:1px 7px}

/* ---------- step nav ---------- */
.wt .stepnav{display:flex;justify-content:space-between;gap:12px;margin:24px 0 0}
.wt .stepnav button{border:1px solid var(--rule);background:var(--sheet);padding:10px 22px;border-radius:8px;
  font-size:.9rem;color:var(--ink-soft)}
.wt .stepnav button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.wt .stepnav button.primary{background:var(--scen-color);color:#fff;border-color:var(--scen-color);font-weight:600}
.wt .stepnav button.primary:hover:not(:disabled){filter:brightness(1.1)}
.wt .stepnav button:disabled{opacity:.4;cursor:default}

/* ---------- embedded chrome ---------- */
.wt.wt-embed{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--scen-color);
  border-radius:0 0 8px 8px;padding:20px 22px 22px;margin:24px 0 34px}
.wt .wt-embed-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px dashed var(--rule)}
.wt .weh-badge{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.12em;
  background:var(--scen-color);color:#fff;padding:3px 10px;border-radius:3px}

</style>
<script>/* Walkthrough runtime — dependency-free port of the priorauth-sdd-course
   walkthrough widget (walkthrough/src/components/*.jsx).

   Scenarios are data. A scenario is stepped through one step at a time; each
   step pairs intent (narrative + YOU DO + CLAUDE'S MOVE) with evidence (a
   replayed terminal and a before/after state panel).

   Usage in a page:
     <div data-wt="kg-147-files"></div>
     <script>WT.register([ ...scenarios... ]); WT.mountAll();<\/script>

   Mounting re-runs under a MutationObserver, because the kit-format course
   players replace their content wrapper's innerHTML on every module change.

   Schema (see README.md for the full reference):
     scenario { id, badge, color, time, title, spec, intro, provenance, steps[] }
     step     { title, narrative[], youDo, claudeSays, terminal[], state }
     terminal line { kind: prompt|claude|tool|out|out-pass|out-fail|gate, text }
     state    { label, before:{title,view}, after:{title,view} }
     view     json | spec | rows | diff | tests | note | stack
              | receipt | bars | window        (added for these courses)
*/
(function (global) {
  'use strict';

  var REDUCED = !!(global.matchMedia &&
    global.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var LINE_DELAY = 420;   // ms between revealed lines
  var TYPE_SPEED = 16;    // ms per character on prompt lines
  var PROMPT_HOLD = 260;  // ms pause after a prompt line finishes typing

  var REGISTRY = {};

  /* ---------------------------------------------------------------- utils */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function html(tag, cls, markup) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (markup != null) n.innerHTML = markup;
    return n;
  }

  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }

  function num(n) {
    return typeof n === 'number' ? n.toLocaleString('en-US') : String(n);
  }

  /* Layer palette for receipt/window views, in canonical layer order. */
  var LAYER_COLORS = ['#33506B', '#1F7A4D', '#B45309', '#7A3E9D', '#A63A3A',
                      '#2D7D8A', '#8A6D2F'];

  /* ---------------------------------------------------------------- views */

  function jsonView(v) {
    var pre = el('pre', 'json');
    var keys = Object.keys(v.data);
    var hl = v.highlight || [];
    pre.appendChild(document.createTextNode('{'));
    keys.forEach(function (k, i) {
      var row = el('div', 'json-row' + (hl.indexOf(k) >= 0 ? ' hl' : ''));
      var val = v.data[k];
      var isNum = typeof val === 'number';
      row.appendChild(document.createTextNode('  '));
      add(row, el('span', 'jk', '"' + k + '"'));
      row.appendChild(document.createTextNode(': '));
      add(row, el('span', isNum ? 'jn' : 'js', isNum ? num(val) : '"' + val + '"'));
      if (i < keys.length - 1) row.appendChild(document.createTextNode(','));
      pre.appendChild(row);
    });
    pre.appendChild(document.createTextNode('}'));
    return pre;
  }

  function specView(v) {
    var box = el('div', 'spec-mini');
    var bar = el('div', 'spec-mini-bar');
    add(bar, el('span', null, v.id),
             el('span', 'stamp stamp-' + String(v.status).toLowerCase().replace(/[^a-z]/g, ''), v.status));
    var body = el('div', 'spec-mini-body');
    (v.rows || []).forEach(function (r) {
      var row = el('div', 'spec-mini-row');
      add(row, el('span', 'smk', r[0]), html('span', 'smv', r[1]));
      body.appendChild(row);
    });
    return add(box, bar, body);
  }

  function rowsView(v) {
    var t = el('table', 'rows');
    var thead = el('thead'), htr = el('tr');
    (v.columns || []).forEach(function (c) { add(htr, el('th', null, c)); });
    add(thead, htr);
    var tb = el('tbody');
    (v.rows || []).forEach(function (r) {
      var tr = el('tr', r.new ? 'row-new' : (r.tone ? 'row-' + r.tone : null));
      (r.cells || []).forEach(function (c) { add(tr, html('td', null, String(c))); });
      add(tb, tr);
    });
    return add(t, thead, tb);
  }

  function diffView(v) {
    var box = el('div', 'diff');
    add(box, el('div', 'diff-file', v.file));
    var pre = el('pre');
    (v.lines || []).forEach(function (l) {
      add(pre, el('div', 'dl dl-' + l[0], l[1]));
    });
    return add(box, pre);
  }

  function testsView(v) {
    var pass = !v.failures;
    var box = el('div', 'tests ' + (pass ? 'tests-pass' : 'tests-fail'));
    add(box, el('div', 'tests-big', v.big || (pass ? 'BUILD SUCCESS' : 'BUILD FAILURE')));
    if (v.run != null) {
      add(box, el('div', 'tests-nums',
        'Tests run: ' + v.run + ' · Failures: ' + (v.failures || 0) + ' · Errors: 0'));
    }
    if (v.note) add(box, html('div', 'tests-note', v.note));
    return box;
  }

  /* A horizontal stacked bar shared by the receipt and window views. */
  function stackedBar(layers, total, highlight) {
    var bar = el('div', 'lbar');
    layers.forEach(function (l, i) {
      var seg = el('div', 'lseg' + (highlight && highlight.indexOf(l.label) >= 0 ? ' lseg-hl' : ''));
      seg.style.width = (total ? (l.tokens / total) * 100 : 0) + '%';
      seg.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      seg.title = l.label + ' · ' + num(l.tokens);
      add(bar, seg);
    });
    return bar;
  }

  /* receipt — the Token Lens: layered bar, itemised lines, verdict stamp. */
  function receiptView(v) {
    var box = el('div', 'receipt');
    var head = el('div', 'rc-head');
    add(head, el('span', 'rc-mode', (v.mode || '') + ' · token receipt'));
    if (v.question) add(head, el('span', 'rc-q', v.question));
    add(box, head);

    var layers = v.layers || [];
    var sum = layers.reduce(function (a, l) { return a + l.tokens; }, 0);
    add(box, stackedBar(layers, sum, v.highlight));

    var list = el('div', 'rc-lines');
    layers.forEach(function (l, i) {
      var row = el('div', 'rc-line' + (v.highlight && v.highlight.indexOf(l.label) >= 0 ? ' hl' : ''));
      var sw = el('span', 'rc-sw');
      sw.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      add(row, sw, el('span', 'rc-k', l.label), el('span', 'rc-dots'),
               el('span', 'rc-v', num(l.tokens)));
      add(list, row);
    });
    add(box, list);

    var tot = el('div', 'rc-total');
    add(tot, el('span', 'rc-k', 'Input total'), el('span', 'rc-dots'),
             el('span', 'rc-v', num(v.inputTotal != null ? v.inputTotal : sum)));
    add(box, tot);

    if (v.output != null) {
      var o = el('div', 'rc-line rc-sub');
      add(o, el('span', 'rc-k', 'Output'), el('span', 'rc-dots'), el('span', 'rc-v', num(v.output)));
      add(box, o);
    }

    var meta = el('div', 'rc-meta');
    if (v.cost) add(meta, el('span', 'rc-chip', v.cost));
    if (v.cacheRead) add(meta, el('span', 'rc-chip', 'cache read ' + v.cacheRead));
    if (v.latency) add(meta, el('span', 'rc-chip', v.latency));
    if (meta.childNodes.length) add(box, meta);

    if (v.verdict) {
      var vk = String(v.verdict).toLowerCase();
      var label = vk === 'verified' ? '✓ Correct'
                : vk === 'failed' ? '✕ FAILED — savings void'
                : '– Ungraded';
      var stamp = el('div', 'rc-verdict rcv-' + vk);
      add(stamp, el('span', 'stamp stamp-' + (vk === 'verified' ? 'verified' : vk === 'failed' ? 'refused' : 'draft'), label));
      if (v.verdictNote) add(stamp, el('span', 'rcv-note', v.verdictNote));
      add(box, stamp);
    }
    return box;
  }

  /* bars — comparative totals across arms/strategies. */
  function barsView(v) {
    var box = el('div', 'bars');
    var items = v.items || [];
    var max = v.max || items.reduce(function (a, i) { return Math.max(a, i.value); }, 0);
    items.forEach(function (it) {
      var row = el('div', 'bars-row' + (it.tone ? ' bt-' + it.tone : ''));
      add(row, el('span', 'bars-k', it.label));
      var track = el('div', 'bars-track');
      var fill = el('div', 'bars-fill');
      fill.style.width = (max ? (it.value / max) * 100 : 0) + '%';
      add(track, fill);
      add(row, track, el('span', 'bars-v', num(it.value) + (v.unit ? ' ' + v.unit : '')));
      if (it.note) add(row, el('span', 'bars-note', it.note));
      add(box, row);
    });
    return box;
  }

  /* window — a context window's layer composition against its capacity. */
  function windowView(v) {
    var box = el('div', 'cwin');
    var layers = v.layers || [];
    var used = v.used != null ? v.used : layers.reduce(function (a, l) { return a + l.tokens; }, 0);
    var cap = v.capacity || used;

    var head = el('div', 'cwin-head');
    add(head, el('span', 'cwin-k', v.label || 'context window'),
              el('span', 'cwin-v', num(used) + ' / ' + num(cap) +
                 ' (' + Math.round((used / cap) * 100) + '% full)'));
    add(box, head);

    var track = el('div', 'cwin-track');
    var used_pct = Math.min(100, (used / cap) * 100);
    var inner = el('div', 'cwin-used');
    inner.style.width = used_pct + '%';
    add(inner, stackedBar(layers, used, v.highlight));
    add(track, inner);
    add(box, track);

    var legend = el('div', 'cwin-legend');
    layers.forEach(function (l, i) {
      var it = el('span', 'cwin-item' + (v.highlight && v.highlight.indexOf(l.label) >= 0 ? ' hl' : ''));
      var sw = el('span', 'rc-sw');
      sw.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      add(it, sw, el('span', null, l.label + ' ' + num(l.tokens)));
      add(legend, it);
    });
    add(box, legend);
    if (v.note) add(box, html('div', 'cwin-note', v.note));
    return box;
  }

  function renderView(v) {
    if (!v) return null;
    switch (v.type) {
      case 'json':    return jsonView(v);
      case 'spec':    return specView(v);
      case 'rows':    return rowsView(v);
      case 'diff':    return diffView(v);
      case 'tests':   return testsView(v);
      case 'receipt': return receiptView(v);
      case 'bars':    return barsView(v);
      case 'window':  return windowView(v);
      case 'note':    return html('div', 'state-note', v.text);
      case 'stack':
        var box = el('div', 'state-stack');
        (v.views || []).forEach(function (sub) {
          var r = renderView(sub);
          if (r) add(box, add(el('div'), r));
        });
        return box;
      default: return null;
    }
  }

  /* ------------------------------------------------------------- terminal */

  /* Replays a session: lines appear in order, prompt lines type out. */
  function Terminal(lines) {
    var shown = 0, typed = 0, skipped = REDUCED, timer = null;

    var root = el('div', 'term');
    var bar = el('div', 'term-bar');
    var dots = el('span', 'term-dots');
    add(dots, el('i'), el('i'), el('i'));
    var title = el('span', 'term-title', 'claude — session replay');
    var actions = el('span', 'term-actions');
    var btn = el('button');
    btn.type = 'button';
    add(actions, btn);
    add(bar, dots, title, actions);
    var body = el('div', 'term-body');
    add(root, bar, body);

    function clear() { if (timer) { clearTimeout(timer); timer = null; } }

    function paint() {
      body.textContent = '';
      var visible = skipped ? lines.length : Math.min(lines.length, shown + 1);
      for (var i = 0; i < visible; i++) {
        var line = lines[i];
        var isCurrent = !skipped && i === shown;
        var text = (line.kind === 'prompt' && isCurrent) ? line.text.slice(0, typed) : line.text;
        var row = el('div', 'tl tl-' + line.kind +
          (isCurrent && line.kind !== 'prompt' ? ' tl-appear' : ''));
        if (line.kind === 'prompt') add(row, el('span', 'tl-caret', '›'));
        if (line.kind === 'claude') add(row, el('span', 'tl-who', '⏺'));
        if (line.kind === 'tool')   add(row, el('span', 'tl-who tl-who-tool', '⚒'));
        var pre = el('pre', null, text);
        if (line.kind === 'prompt' && isCurrent && typed < line.text.length) {
          add(pre, el('span', 'cursor'));
        }
        add(row, pre);
        add(body, row);
      }
      body.scrollTop = body.scrollHeight;
      var done = skipped || shown >= lines.length;
      btn.textContent = done ? 'replay ↺' : 'show all';
    }

    function tick() {
      clear();
      if (skipped || shown >= lines.length) { paint(); return; }
      var line = lines[shown];
      if (line.kind === 'prompt' && typed < line.text.length) {
        timer = setTimeout(function () { typed++; paint(); tick(); }, TYPE_SPEED);
      } else {
        timer = setTimeout(function () {
          shown++; typed = 0; paint(); tick();
        }, line.kind === 'prompt' ? PROMPT_HOLD : LINE_DELAY);
      }
      paint();
    }

    btn.addEventListener('click', function () {
      var done = skipped || shown >= lines.length;
      if (done) { shown = 0; typed = 0; skipped = false; }
      else { skipped = true; }
      tick();
    });

    tick();
    return { el: root, destroy: clear };
  }

  /* ---------------------------------------------------------- state panel */

  function StatePanel(state) {
    var side = 'before';
    var single = !state.after;

    var root = el('div', 'state');
    var head = el('div', 'state-head');
    add(head, el('span', 'state-label', state.label || ''));

    var beforeBtn, afterBtn;
    if (!single) {
      var toggle = el('span', 'ba-toggle');
      toggle.setAttribute('role', 'tablist');
      beforeBtn = el('button', 'on', 'Before');
      afterBtn = el('button', null, 'After');
      beforeBtn.type = afterBtn.type = 'button';
      beforeBtn.addEventListener('click', function () { show('before'); });
      afterBtn.addEventListener('click', function () { show('after'); });
      add(toggle, beforeBtn, afterBtn);
      add(head, toggle);
    }

    var body = el('div', 'state-body sb-before');
    var apply = el('button', 'apply', 'Apply this step — see the after state →');
    apply.type = 'button';
    apply.addEventListener('click', function () { show('after'); });

    add(root, head, body);
    if (!single) add(root, apply);

    function show(next) {
      side = next;
      body.className = 'state-body sb-' + side;
      body.textContent = '';
      var cur = side === 'before' ? state.before : state.after;
      if (cur.title) add(body, el('div', 'state-title st-' + side, cur.title));
      var v = renderView(cur.view);
      if (v) add(body, v);
      if (!single) {
        beforeBtn.className = side === 'before' ? 'on' : '';
        afterBtn.className = side === 'after' ? 'on on-after' : '';
        apply.style.display = side === 'before' ? '' : 'none';
      }
    }

    show('before');
    return { el: root };
  }

  /* ----------------------------------------------------------- walkthrough */

  function provenanceEl(p) {
    if (!p) return null;
    var measured = p.kind === 'measured';
    var box = el('span', 'wt-prov wt-prov-' + (measured ? 'measured' : 'illustrative'));
    add(box, el('span', 'wt-prov-k', measured ? 'MEASURED' : 'ILLUSTRATIVE'));
    if (p.source) add(box, el('span', 'wt-prov-v', p.source));
    return box;
  }

  function renderScenario(host, scenario, opts) {
    opts = opts || {};
    var embedded = opts.embedded !== false;
    var stepIdx = 0;
    var live = [];   // teardown handles for the current step

    host.textContent = '';
    var theme = host.getAttribute('data-wt-theme') || opts.theme || '';
    host.className = 'wt' + (embedded ? ' wt-embed' : '') + (theme === 'dark' ? ' wt-dark' : '');
    host.style.setProperty('--scen-color', scenario.color || '#33506B');

    if (embedded) {
      var eh = el('div', 'wt-embed-head');
      add(eh, el('span', 'weh-badge', scenario.badge || 'WALKTHROUGH'),
              el('span', 'weh-title', scenario.title + ' — walk it step by step'));
      var prov = provenanceEl(scenario.provenance);
      if (prov) add(eh, prov);
      if (scenario.time) add(eh, el('span', 'weh-time', scenario.time));
      add(host, eh);
    } else {
      var sh = el('div', 'scen-head');
      var meta = el('div', 'scen-meta');
      add(meta, el('span', 'scen-badge', scenario.badge || 'WALKTHROUGH'));
      if (scenario.spec) add(meta, el('span', 'scen-spec', scenario.spec));
      var p2 = provenanceEl(scenario.provenance);
      if (p2) add(meta, p2);
      add(sh, meta, el('h2', null, scenario.title));
      if (scenario.intro) add(sh, html('p', 'scen-intro', scenario.intro));
      add(host, sh);
    }

    var progress = el('div', 'progress');
    var stepWrap = el('div');
    var nav = el('div', 'stepnav');
    var prevBtn = el('button', null, '← Previous');
    var nextBtn = el('button', 'primary', 'Next step →');
    prevBtn.type = nextBtn.type = 'button';
    add(nav, prevBtn, nextBtn);
    add(host, progress, stepWrap, nav);

    if (embedded && scenario.foot) {
      add(host, html('div', 'wt-embed-foot', scenario.foot));
    }

    prevBtn.addEventListener('click', function () { go(stepIdx - 1); });
    nextBtn.addEventListener('click', function () { go(stepIdx + 1); });

    host.setAttribute('tabindex', '-1');
    host.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { go(stepIdx + 1); }
      else if (e.key === 'ArrowLeft') { go(stepIdx - 1); }
    });

    function teardown() {
      live.forEach(function (h) { if (h && h.destroy) h.destroy(); });
      live = [];
    }

    function go(i) {
      if (i < 0 || i >= scenario.steps.length) return;
      stepIdx = i;
      render();
    }

    function render() {
      teardown();
      var step = scenario.steps[stepIdx];
      var last = stepIdx === scenario.steps.length - 1;

      progress.textContent = '';
      scenario.steps.forEach(function (st, i) {
        var d = el('button', 'prog-dot' + (i === stepIdx ? ' on' : '') + (i < stepIdx ? ' done' : ''));
        d.type = 'button';
        d.title = st.title;
        d.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.title);
        add(d, el('span', null, String(i + 1)));
        d.addEventListener('click', function () { go(i); });
        add(progress, d);
      });
      add(progress, el('span', 'prog-label',
        'Step ' + (stepIdx + 1) + ' of ' + scenario.steps.length + ' — ' + step.title));

      stepWrap.textContent = '';
      var sec = el('section', 'step');

      var copy = el('div', 'step-copy');
      var h3 = el('h3');
      add(h3, el('span', 'step-n', 'STEP ' + (stepIdx + 1)));
      h3.appendChild(document.createTextNode(step.title));
      add(copy, h3);
      (step.narrative || []).forEach(function (p) { add(copy, html('p', null, p)); });
      if (step.youDo) {
        var yd = el('div', 'youdo');
        add(yd, el('div', 'youdo-k', 'YOU DO'), html('div', 'youdo-v', step.youDo));
        add(copy, yd);
      }
      if (step.claudeSays) {
        var cs = el('div', 'claudesays');
        add(cs, el('div', 'youdo-k cs-k', "CLAUDE'S MOVE"), html('div', 'youdo-v', step.claudeSays));
        add(copy, cs);
      }
      add(sec, copy);

      var screens = el('div', 'step-screens');
      if (step.terminal && step.terminal.length) {
        var t = Terminal(step.terminal);
        live.push(t);
        add(screens, t.el);
      }
      if (step.state) {
        add(screens, StatePanel(step.state).el);
      }
      if (step.source) {
        var cite = el('div', 'wt-cite');
        add(cite, el('span', 'wt-cite-k', 'MEASURED'), el('span', null, step.source));
        add(screens, cite);
      }
      add(sec, screens);
      add(stepWrap, sec);

      prevBtn.disabled = stepIdx === 0;
      nextBtn.disabled = last;
      nextBtn.textContent = last ? 'Walkthrough complete' : 'Next step →';
    }

    render();
    return { destroy: teardown };
  }

  /* --------------------------------------------------------------- mounts */

  function mountAll(root) {
    var scope = root || document;
    var nodes = scope.querySelectorAll('[data-wt]:not([data-wt-mounted])');
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var sc = REGISTRY[node.getAttribute('data-wt')];
      if (!sc) continue;
      node.setAttribute('data-wt-mounted', '1');
      renderScenario(node, sc, { embedded: true });
    }
  }

  /* The course players swap innerHTML on module change, so watch for new
     mount points rather than relying on a single pass at load. */
  var pending = null;
  function observe() {
    if (!global.MutationObserver || !document.body) return;
    new MutationObserver(function () {
      if (pending) return;
      pending = setTimeout(function () { pending = null; mountAll(); }, 60);
    }).observe(document.body, { childList: true, subtree: true });
  }

  /* Standalone quick-reference page: every scenario behind a tab. */
  function standalone(host, ids) {
    var list = (ids && ids.length ? ids : Object.keys(REGISTRY))
      .map(function (id) { return REGISTRY[id]; })
      .filter(Boolean);
    if (!list.length) return;

    host.textContent = '';
    var tabs = el('div', 'wt-tabs');
    var stage = el('div', 'wt-stage');
    add(host, tabs, stage);
    var current = null;

    function open(sc, btn) {
      if (current && current.destroy) current.destroy();
      for (var i = 0; i < tabs.childNodes.length; i++) {
        tabs.childNodes[i].className = 'wt-tab';
      }
      btn.className = 'wt-tab on';
      btn.style.setProperty('--scen-color', sc.color || '#33506B');
      stage.textContent = '';
      var holder = el('div');
      add(stage, holder);
      current = renderScenario(holder, sc, { embedded: false });
    }

    list.forEach(function (sc, i) {
      var b = el('button', 'wt-tab');
      b.type = 'button';
      add(b, el('span', 'wt-tab-badge', sc.badge || ''), el('span', null, sc.title));
      b.style.setProperty('--scen-color', sc.color || '#33506B');
      b.addEventListener('click', function () { open(sc, b); });
      add(tabs, b);
      if (i === 0) setTimeout(function () { open(sc, b); }, 0);
    });
  }

  function register(scenarios) {
    (scenarios || []).forEach(function (s) { if (s && s.id) REGISTRY[s.id] = s; });
  }

  global.WT = {
    register: register,
    mountAll: mountAll,
    standalone: standalone,
    scenarios: REGISTRY
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { mountAll(); observe(); });
  } else {
    mountAll();
    observe();
  }

WT.register([{"id":"uce-app-tour","badge":"WALKTHROUGH","color":"#33506B","time":"~5 min","title":"Tour the instrument","spec":"U00 · MedFlow Copilot, screen by screen","intro":"Your classroom is an app, not a page. Six stops: the review queue, the Copilot panel, the toggle bar, the token receipt, the Compare drawer, and the stamp that decides whether any of it counted.","provenance":{"kind":"illustrative"},"foot":"Do it for real: <code>SETUP.md</code> — two terminals, no API key — then <a href=\"http://localhost:5173\">localhost:5173</a>","steps":[{"title":"Stop 1 — the review queue","narrative":["MedFlow Copilot is a prior-authorization portal. The left rail is the clinician's app: <b>Review queue</b>, <b>Requests</b>, <b>Members</b>, <b>Submit request</b>. The queue itself holds three requests that scored between the review and approval thresholds, so a human has to decide: <b>PA-1002</b> (score 65, missing a neurological deficit), <b>PA-1004</b> (65, failed 12 weeks conservative management), <b>PA-1010</b> (50, two criteria missing).","Learn these three ids now. They are the cast for fifteen modules — almost every graded question in the course is about one of them, and you will watch strategies get them right, get them expensively right, and occasionally get them wrong."],"youDo":"Start both terminals from <code>SETUP.md</code>, open <code>localhost:5173</code>, and leave it running beside this player for the whole course.","state":{"label":"the app at rest","before":{"title":"WORK QUEUE — three requests awaiting a clinician","view":{"type":"stack","views":[{"type":"note","text":"<img src=\"assets/shot-1-queue.png\" alt=\"MedFlow Copilot: the manual-review queue with PA-1002, PA-1004 and PA-1010, and the Copilot panel on the right\" style=\"width:100%;border-radius:8px\">"},{"type":"note","text":"Left: the queue. Right: the Copilot panel — <em>every call gets a receipt</em>. That header line is the whole design of the app."}]}}}},{"title":"Stop 2 — the toggle bar is your table of contents","narrative":["The Copilot panel has three controls and no settings menu. The <b>toggle bar</b> picks the context strategy — ten of them, <code>naive</code> through <code>routed</code>. The <b>standing questions</b> dropdown picks a preset. The box under it takes free-form questions.","Two rules that will save you an hour of confusion. The ten toggles map one-to-one onto modules — <code>notes</code> is U03, <code>okf</code> is U05, <code>isolated</code> is U09, <code>routed</code> is U12 — so treat the bar as a syllabus. And only the <b>preset</b> questions are graded: a free-form ask comes back stamped UNGRADED and proves nothing, however good the answer looks."],"youDo":"Click each toggle once to see the bar highlight move, then open the standing-questions dropdown and read all ten presets.","state":{"label":"ten toggles, ten modules","before":{"title":"THE BAR, DECODED","view":{"type":"rows","columns":["toggle","family","module"],"rows":[{"cells":["naive","— (the control)","U02"]},{"cells":["budgeted","select / compress","U04 · U07"]},{"cells":["compressed","compress","U07"]},{"cells":["cached","position economics","U06"]},{"cells":["jit","select","U04"]},{"cells":["graph","select","U05"]},{"cells":["okf","select","U05"]},{"cells":["notes","write","U03"]},{"cells":["isolated","isolate","U09"]},{"cells":["routed","chooses a family","U12"]}]}}}},{"title":"Stop 3 — the receipt, line by line","narrative":["Pick <b>Q1</b> — <em>\"Which criteria apply to procedure 72148 and what is the weight of each?\"</em> — leave the mode on <code>naive</code>, and press Ask. Under the answer, the Token Lens prints an itemized bill for that one call.","Read it as five lines, because each line is a course track. <b>System</b> 65 — the static surface, U06. <b>Retrieved</b> 1,612 — the whole seeded domain, dumped in; selection, U04–U05. <b>Tool results</b> 0 — shaping, U07. <b>History</b> 0 — memory, U03 and U08. <b>User turn</b> 17 — the only part most people call \"the prompt\". They sum to <b>1,694</b>, and that reconciliation always holds: five layers, one total, no unexplained remainder."],"youDo":"Ask <b>Q1</b> in <code>naive</code>, then add the five layer numbers on the receipt by hand and check they equal the input total.","claudeSays":"The model read all 1,612 tokens of dumped records, found the three criteria for 72148, and reported them with their weights. Every other record in the dump was paid for and ignored.","source":"bench/results/replay-fullgrid.json#Q1-naive","state":{"label":"Q1 · naive","before":{"title":"THE TOKEN LENS ON SCREEN","view":{"type":"note","text":"<img src=\"assets/shot-2-receipt.png\" alt=\"The Copilot panel showing the Q1 answer and a naive-mode token receipt: System 65, Retrieved 1,612, Tool results 0, History 0, User turn 17, input total 1,694, VERIFIED\" style=\"width:100%;border-radius:8px\">"}},"after":{"title":"THE SAME RECEIPT, AS DATA","view":{"type":"receipt","mode":"naive","question":"Q1 · criteria and weights for procedure 72148","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":17}],"highlight":["Retrieved"],"inputTotal":1694,"output":50,"cost":"$0.005832","cacheRead":"0%","verdict":"verified"}}}},{"title":"Stop 4 — one toggle, same verdict","narrative":["Now flip the bar to <code>okf</code> and press Ask again. Same question, same answer text, same green stamp — and the retrieved layer falls from 1,612 to <b>280</b>, because instead of a domain dump the assembler shipped two canonical concept files plus the procedure catalog.","Watch the <b>session strip</b> along the bottom while you do it. It read <code>1 call · 1,694 in-tok · $0.0058</code>; after the second ask it reads <code>2 calls · 2,056 in-tok · $0.0077</code>. That strip accumulates for as long as the app stays open, and several labs later in the course are built on reading it."],"youDo":"With Q1 still pinned, click <code>okf</code> and Ask. Compare the retrieved line, then glance at the session strip at the bottom of the panel.","source":"bench/results/replay-fullgrid.json#Q1-okf","state":{"label":"Q1 · okf","before":{"title":"SAME QUESTION, ONE TOGGLE LATER","view":{"type":"note","text":"<img src=\"assets/shot-3-okf.png\" alt=\"okf-mode receipt for Q1: System 65, Retrieved 280, User turn 17, input total 362, VERIFIED, and the session strip reading 2 calls, 2,056 in-tok, $0.0077\" style=\"width:100%;border-radius:8px\">"}},"after":{"title":"THE RETRIEVED LINE, BEFORE AND AFTER","view":{"type":"bars","unit":"tokens (retrieved layer)","max":1612,"items":[{"label":"naive","value":1612,"tone":"bad","note":"the entire seeded domain as pretty-printed JSON"},{"label":"okf","value":280,"tone":"win","note":"thresholds + eligibility concepts + the procedure catalog — same ✓ verdict"}]}}}},{"title":"Stop 5 — the Compare drawer","narrative":["Clicking <b>Compare strategies</b> puts two receipts side by side for the same question and does the arithmetic for you: <em>okf used 79% fewer input tokens than naive · cost Δ $0.0040 saved</em>. Both stamped VERIFIED.","This drawer is where most of the course's evidence gets produced — U04 compares <code>naive</code> against <code>jit</code> here, U07 compares <code>budgeted</code> against <code>compressed</code>. Get used to reading the two receipts <em>and</em> the two stamps, because the drawer will happily show you a cheaper column that failed its answer key."],"youDo":"Click <b>Compare strategies</b>, set the left column to <code>naive</code> and the right to <code>okf</code>, and read the summary bar at the bottom of the drawer.","source":"bench/results/replay-fullgrid.json#Q1-naive,bench/results/replay-fullgrid.json#Q1-okf","state":{"label":"Compare · Q1 · naive vs okf","before":{"title":"TWO RECEIPTS, ONE QUESTION","view":{"type":"stack","views":[{"type":"note","text":"<img src=\"assets/shot-4-compare.png\" alt=\"The Compare strategies drawer showing naive at 1,694 input tokens beside okf at 362, both VERIFIED, with a summary line reading okf used 79% fewer input tokens than naive\" style=\"width:100%;border-radius:8px\">"},{"type":"rows","columns":["column","input tokens","cost","verdict"],"rows":[{"cells":["naive","1,694","$0.005832","✓ verified"]},{"cells":["okf","362","$0.001836","✓ verified"],"tone":"win"},{"cells":["<b>delta</b>","<b>−79%</b>","<b>$0.0040 saved</b>","unchanged"]}]}]}}}},{"title":"Stop 6 — the stamp is the point","narrative":["One more screen before you start: <b>Members</b>. Member M-2003's date of birth carries a REDACTED badge, because the seed data minimizes that field on purpose. Now ask <b>Q7</b> — <em>\"What is member M-2003's date of birth?\"</em> — in <code>naive</code>.","Naive dumps the whole domain, the model finds something that looks like a birth date, and answers <em>\"born on 1984-06-17 according to the member record\"</em>. The grader stamps <b>✕ FAILED</b>: the key required a refusal and forbade a date pattern. The control arm — the one that spends the most and hides nothing — is the arm that fabricates. Nine of its ten answers are correct; this is the tenth.","That is the law the app exists to enforce, and the only thing you need to carry into U01: <b>a token saving that fails its answer key is not a saving</b> — and a token <em>expense</em> that fails it is just a more expensive defect."],"youDo":"Open <b>Members</b>, find the REDACTED badge on M-2003, then ask <b>Q7</b> in <code>naive</code> and read the stamp.","source":"bench/results/replay-fullgrid.json#Q7-naive","state":{"label":"Q7 · naive","before":{"title":"THE FIELD, ON SCREEN","view":{"type":"note","text":"<img src=\"assets/shot-5-members.png\" alt=\"The Members list with a REDACTED badge on the date-of-birth field\" style=\"width:100%;border-radius:8px\">"}},"after":{"title":"THE CONTROL ARM FAILS ITS OWN KEY","view":{"type":"receipt","mode":"naive","question":"Q7 · M-2003's date of birth","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":9}],"inputTotal":1686,"output":28,"cost":"$0.005478","cacheRead":"0%","verdict":"failed","verdictNote":"answered with a date · missing: insufficient evidence, redacted — U10 takes this apart"}}}}]},{"id":"uce-ten-receipts","badge":"WALKTHROUGH","color":"#B45309","time":"~6 min","title":"Ten receipts, one question","spec":"U01 · the five layers and the four families, read off a single question","intro":"Pin Q9 and ask it in every one of the ten toggles, left to right. You are not comparing answers — nine of the ten say the same thing. You are comparing receipt shapes, and one of them stops saying the same thing.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json#Q9"},"foot":"Do it for real: Copilot panel, preset <b>Q9</b>, toggle bar left to right · or <code>python bench/run_campaign.py --questions Q9 --modes naive,budgeted,compressed,cached,jit,graph,okf,notes,isolated,routed</code>","steps":[{"title":"Ask the same question ten times","narrative":["Q9 is the aggregation preset: <em>\"Summarize member M-2001's authorization history: how many requests and what were the outcomes?\"</em> Its answer key wants five facts — <code>2</code>, <code>PA-1001</code>, <code>APPROVED</code>, <code>PA-1004</code>, <code>MANUAL_REVIEW</code>.","One question, ten strategies, ten graded receipts. That grid is the whole module: every toggle on the bar is a module later in the course, and this is the first time you see them all standing next to each other."],"youDo":"Pin <b>Q9</b> in the standing-questions list and click through the toggle bar left to right — <code>naive</code> to <code>routed</code>, ten asks.","claudeSays":"Each ask re-assembles the context from scratch under a different strategy, then the same answer key grades whatever comes back.","source":"bench/results/replay-fullgrid.json#Q9","terminal":[{"kind":"prompt","text":"python bench/run_campaign.py --questions Q9 --modes naive,budgeted,compressed,cached,jit,graph,okf,notes,isolated,routed"},{"kind":"out","text":" Q9 naive      r0   1,700 tok  PASS\n Q9 budgeted   r0     565 tok  PASS\n Q9 compressed r0     208 tok  FAIL (SAVINGS VOID)\n Q9 cached     r0     736 tok  PASS\n Q9 jit        r0     220 tok  PASS"},{"kind":"out","text":" Q9 graph      r0     286 tok  PASS\n Q9 okf        r0     190 tok  PASS\n Q9 notes      r0     167 tok  PASS\n Q9 isolated   r0   1,796 tok  PASS\n Q9 routed     r0   1,796 tok  PASS"},{"kind":"out-fail","text":"1 of 10 cells void: compressed — missing PA-1004, MANUAL_REVIEW"}],"state":{"label":"Q9 · all ten modes","before":{"title":"TEN RECEIPTS FOR ONE QUESTION","view":{"type":"rows","columns":["mode","input tokens","verdict"],"rows":[{"cells":["naive","1,700","✓ verified"]},{"cells":["budgeted","565","✓ verified"]},{"cells":["compressed","208","✕ FAILED"],"tone":"bad"},{"cells":["cached","736","✓ verified"]},{"cells":["jit","220","✓ verified"]},{"cells":["graph","286","✓ verified"]},{"cells":["okf","190","✓ verified"]},{"cells":["notes","167","✓ verified"],"tone":"win"},{"cells":["isolated","1,796","✓ verified"]},{"cells":["routed","1,796","✓ verified"]}]}}}},{"title":"Five layers: the receipt's unit of account","narrative":["Every receipt itemizes the same five lines — <b>system</b>, <b>retrieved</b>, <b>tool results</b>, <b>history</b>, <b>user turn</b> — and they always sum to the input total. That sum rule is your first sanity check on any token dashboard.","Put <code>naive</code> and <code>notes</code> side by side and the point lands without a single definition. Naive spends 1,612 of its 1,700 tokens in one layer. Notes spends 50 there, moves 58 into history, and finishes the job for 167."],"claudeSays":"Both answers name PA-1001 APPROVED and PA-1004 MANUAL_REVIEW. The model did nothing different; the assembler did.","source":"bench/results/replay-fullgrid.json#Q9-naive,bench/results/replay-fullgrid.json#Q9-notes","state":{"label":"same answer, two shapes","before":{"title":"NAIVE — one fat layer","view":{"type":"receipt","mode":"naive","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"highlight":["Retrieved"],"inputTotal":1700,"output":26,"cost":"$0.00549","cacheRead":"0%","verdict":"verified"}},"after":{"title":"NOTES — five thin ones","view":{"type":"receipt","mode":"notes","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":44},{"label":"Retrieved","tokens":50},{"label":"Tool results","tokens":0},{"label":"History","tokens":58},{"label":"Your turn","tokens":15}],"highlight":["Retrieved","History"],"inputTotal":167,"output":26,"cost":"$0.000891","cacheRead":"0%","verdict":"verified"}}}},{"title":"Four families, ten toggles","narrative":["Every one of the ten strategies is a member of one of four families. <b>Write</b> puts context outside the window and reads it back (notes). <b>Select</b> ships only the shortlist (budgeted, jit, graph, okf). <b>Compress</b> rewrites what ships into fewer tokens (compressed). <b>Isolate</b> hands the load to a sub-agent with its own window (isolated).","Diagnose by layer, then act by family. Q9's fat line is <code>retrieved</code>, so anything that attacks retrieved is a candidate — and four different families all have a way in. That is why the taxonomy argument is a waste of time: name the layer, and the shortlist writes itself."],"source":"bench/results/replay-fullgrid.json#Q9","state":{"label":"family → layer → Q9 result","before":{"title":"THE MAP, WITH Q9's NUMBERS ATTACHED","view":{"type":"rows","columns":["family","toggles","layer it attacks","best on Q9"],"rows":[{"cells":["write","notes","history (replaces raw transcript)","167 ✓"],"tone":"win"},{"cells":["select","budgeted · jit · graph · okf","retrieved","190 ✓ (okf)"]},{"cells":["compress","compressed","retrieved","208 ✕ FAILED"],"tone":"bad"},{"cells":["isolate","isolated","moves retrieved into tool results","1,796 ✓"]}]}}}},{"title":"The two that do not fit","narrative":["Two toggles are not strategy families at all, and mislabelling them is a real mistake. <code>cached</code> ships <em>the same facts</em> — 736 input tokens on Q9, more than four of the select arms — but re-orders them so the stable part sits at the front where a cache can read it. It is position economics, not token reduction.","<code>routed</code> is not a lever either; it <em>chooses</em> levers by question class. On Q9 the router classifies aggregation and dispatches to <code>isolated</code> — so routed's receipt is isolated's receipt, 1,796 tokens, the most expensive correct arm on this question. A router is only ever as good as the graded evidence behind it, and this one has a class it has not learned yet."],"source":"bench/results/replay-fullgrid.json#Q9-cached,bench/results/replay-fullgrid.json#Q9-routed","state":{"label":"the misfits","before":{"title":"NEITHER OF THESE IS A FAMILY","view":{"type":"rows","columns":["toggle","Q9 tokens","what it actually changes"],"rows":[{"cells":["cached","736","the <b>order</b> of the same content, so a prefix can be cached — cost per token, not count"]},{"cells":["routed","1,796","which family runs — on aggregation it picks <code>isolated</code>, the priciest correct arm here"],"tone":"bad"},{"cells":["okf","190","for contrast: an actual select move on the same question"],"tone":"win"}]}}}},{"title":"The shape that changed most","narrative":["Look for the receipt that does not merely shrink but <em>re-plumbs</em>. That is <code>isolated</code>: retrieved drops to <b>0</b> and 1,710 tokens appear under tool results, because a sub-agent read the domain in its own window and handed back a summary.","And it costs <b>more than naive</b> — 1,796 against 1,700, with double the output tokens, because the main call pays for the sub-agent's work plus its own turn. Isolation buys you a clean window and a bounded blast radius. On a one-shot lookup it buys you nothing and charges you for it."],"source":"bench/results/replay-fullgrid.json#Q9-isolated","state":{"label":"token receipt · Q9 · isolated","before":{"title":"SAME TOTAL, DIFFERENT PLUMBING — AND DEARER THAN THE CONTROL","view":{"type":"receipt","mode":"isolated","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":64},{"label":"Retrieved","tokens":0},{"label":"Tool results","tokens":1710},{"label":"History","tokens":0},{"label":"Your turn","tokens":22}],"highlight":["Retrieved","Tool results"],"inputTotal":1796,"output":52,"cost":"$0.006168","cacheRead":"0%","verdict":"verified","verdictNote":"correct, and 96 tokens more expensive than naive"}}}},{"title":"The one that changed the verdict","narrative":["Nine receipts differ in shape. One differs in <b>outcome</b>. <code>compressed</code> comes back at 208 tokens — an 88% saving against the control — and the grader stamps it <b>✕ FAILED</b>, because the abstract dropped PA-1004 and MANUAL_REVIEW and replaced them with \"her history shows consistent approvals\".","That is the law this course runs on: <b>a saving that changes the answer is not a saving.</b> Shape is interesting; the stamp is decisive. U07 takes this exact cell apart and fixes it."],"youDo":"Re-ask Q9 in <code>compressed</code> and read the answer text, not the token total, before you look at the stamp.","source":"bench/results/replay-fullgrid.json#Q9-compressed","terminal":[{"kind":"prompt","text":"Summarize member M-2001's authorization history: how many requests and what were the outcomes?"},{"kind":"tool","text":"assemble(mode=compressed) → prune → extract-verbatim → abstract : retrieved 1,612 → 120 tok"},{"kind":"claude","text":"Member M-2001 (Rosa Delgado) has 2 authorization requests:\nPA-1001 was APPROVED. Her history shows consistent approvals."},{"kind":"gate","text":"⏸  GRADING against the Q9 answer key (5 required facts)"},{"kind":"out-fail","text":"✕ FAILED — missing: PA-1004, MANUAL_REVIEW · savings void"}],"state":{"label":"the only column that decides","before":{"title":"SORTED BY TOKENS — THE TEMPTING VIEW","view":{"type":"rows","columns":["mode","input tokens"],"rows":[{"cells":["notes","167"]},{"cells":["okf","190"]},{"cells":["compressed","208"],"tone":"win"},{"cells":["jit","220"]},{"cells":["graph","286"]}]}},"after":{"title":"SORTED BY TOKENS, WITH THE STAMP ATTACHED","view":{"type":"rows","columns":["mode","input tokens","verdict","eligible?"],"rows":[{"cells":["notes","167","✓ verified","yes"],"tone":"win"},{"cells":["okf","190","✓ verified","yes"],"tone":"win"},{"cells":["compressed","208","✕ FAILED","<b>no — savings void</b>"],"tone":"bad"},{"cells":["jit","220","✓ verified","yes"]},{"cells":["graph","286","✓ verified","yes"]}]}}}}]},{"id":"uce-baseline-receipt","badge":"WALKTHROUGH","color":"#2e6b8a","time":"~4 min","title":"Record the baseline","spec":"U02 · read a receipt line by line","intro":"Before you optimise anything you need a number to beat. Ask Q9 in naive mode and read the receipt one layer at a time — this is the table every later module has to improve on.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json#Q9-naive"},"foot":"Do it for real: start the bench in replay mode, pin Q9, mode <code>naive</code> · <code>SETUP.md</code>","steps":[{"title":"Pin the question","narrative":["Q9 is an <b>aggregation</b> question: <em>\"Summarize member M-2001's authorization history: how many requests and what were the outcomes?\"</em> Answering it correctly requires two specific facts — PA-1001 approved, and PA-1004 in manual review.","It is the question this course returns to most, because aggregation is where naive context assembly looks most defensible: you feel like you need everything. You do not."],"youDo":"In the Copilot panel, pick <b>Q9</b> from the standing-questions list and set the mode toggle to <code>naive</code>.","state":{"label":"the answer key","before":{"title":"WHAT A CORRECT ANSWER MUST CONTAIN","view":{"type":"rows","columns":["required fact","why it is required"],"rows":[{"cells":["PA-1001 · APPROVED","the first of M-2001's two requests"]},{"cells":["PA-1004 · MANUAL_REVIEW","the second — an answer that omits it is wrong, however cheap"]}]}}}},{"title":"Ask it, and read the bill","narrative":["Naive mode does the obvious thing: it puts the whole seeded domain into the prompt and lets the model find the answer. It works. The answer is correct.","Now look at the receipt rather than the answer. <b>1,700 input tokens</b>, of which <b>1,612 are retrieved context</b> — the domain dump. The system prompt is 65 tokens and your actual question is 23."],"claudeSays":"The model reads all 1,612 tokens of retrieved records, finds the two rows about M-2001, and reports them. Every other record was paid for and ignored.","terminal":[{"kind":"prompt","text":"Summarize member M-2001's authorization history: how many requests and what were the outcomes?"},{"kind":"tool","text":"assemble(mode=naive) → retrieved: all members, all requests, all criteria"},{"kind":"claude","text":"Member M-2001 has 2 authorization requests: PA-1001 APPROVED\n(score 100); PA-1004 MANUAL_REVIEW (score 65)."},{"kind":"out-pass","text":"✓ verified — both key facts present"}],"source":"bench/results/replay-fullgrid.json#Q9-naive","state":{"label":"token receipt · Q9 · naive","before":{"title":"THE BASELINE","view":{"type":"receipt","mode":"naive","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"highlight":["Retrieved"],"inputTotal":1700,"output":26,"cost":"$0.00549","cacheRead":"0%","verdict":"verified"}}}},{"title":"Where the money is","narrative":["Five layers enter every context window, and on this call one of them is 95% of the bill. That is the whole diagnosis: <b>the retrieved layer is the target</b>, and the other four are rounding errors.","This is why \"write a better prompt\" is the wrong lever here. Your prompt is 23 tokens. Halving it saves you eleven."],"state":{"label":"layer shares","before":{"title":"ONE LAYER, NINETY-FIVE PERCENT","view":{"type":"bars","unit":"tokens","max":1612,"items":[{"label":"Retrieved","value":1612,"tone":"bad","note":"95% of the input — the whole domain, sent to answer one question about one member"},{"label":"System","value":65},{"label":"Your turn","value":23},{"label":"History","value":0},{"label":"Tool results","value":0}]}}}},{"title":"The number to beat","narrative":["Record it. <b>1,700 input tokens, verified correct, $0.00549.</b> Every strategy in the next twelve modules gets measured against this row, on this question, with the same answer key.","And note the second half of that sentence, because it is the rule the whole course turns on: a strategy that beats 1,700 tokens but drops PA-1004 has not won anything. In U07 you will watch exactly that happen."],"youDo":"Repeat for all ten standing questions in <code>naive</code> mode and save the table. That is your U02 lab deliverable.","source":"bench/results/replay-fullgrid.json#Q9","state":{"label":"baseline row","before":{"title":"BEFORE — what you know now","view":{"type":"rows","columns":["question","mode","input tokens","verdict"],"rows":[{"cells":["Q9 · aggregation","naive","1,700","✓ verified"]}]}},"after":{"title":"AFTER — what the rest of the course fills in","view":{"type":"rows","columns":["question","mode","input tokens","verdict"],"rows":[{"cells":["Q9 · aggregation","naive","1,700","✓ verified"]},{"cells":["Q9 · aggregation","budgeted","565","✓ verified"],"new":true},{"cells":["Q9 · aggregation","compressed","208","✕ FAILED"],"tone":"bad"},{"cells":["Q9 · aggregation","jit","220","✓ verified"],"new":true},{"cells":["Q9 · aggregation","okf","190","✓ verified"],"new":true},{"cells":["Q9 · aggregation","notes","167","✓ verified"],"new":true}]}}}}]},{"id":"uce-notes-memory","badge":"WALKTHROUGH","color":"#2F6F5E","time":"~5 min","title":"The handover sheet","spec":"U03 · what notes mode actually moves, and what it costs to keep","intro":"Ask Q9 in naive, then in notes. The bill drops from 1,700 tokens to 167 — but not for the reason the word \"memory\" suggests. Read the layers and you find out what the write family really buys, and what you have to pay every turn to keep it.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json#Q9-naive,bench/results/replay-fullgrid.json#Q9-notes"},"foot":"Do it for real: Copilot panel, preset <b>Q9</b>, <code>naive</code> then <code>notes</code> — and keep the same session","steps":[{"title":"Ask it twice","narrative":["Q9 is the aggregation preset: <em>\"Summarize member M-2001's authorization history: how many requests and what were the outcomes?\"</em> Ask it in <code>naive</code>, then flip to <code>notes</code> and ask it again in the same session.","Both answers name PA-1001 APPROVED and PA-1004 MANUAL_REVIEW; both come back ✓ verified. The interesting thing is not the answer, it is the receipt: <b>1,700 tokens</b> becomes <b>167</b>, and the layer shares are not the same shape at all."],"youDo":"Pin <b>Q9</b>, ask in <code>naive</code>, then switch the toggle to <code>notes</code> and ask again without changing the session.","claudeSays":"On the notes ask, the assembler pulled only the requests the question names into the retrieved layer, and put structured session notes into the history layer instead of a transcript.","source":"bench/results/replay-fullgrid.json#Q9-naive,bench/results/replay-fullgrid.json#Q9-notes","terminal":[{"kind":"prompt","text":"Summarize member M-2001's authorization history: how many requests and what were the outcomes?"},{"kind":"tool","text":"assemble(mode=naive) → retrieved: FULL DOMAIN DATA (JSON)"},{"kind":"out-pass","text":"✓ verified · 1,700 input tokens · $0.00549"},{"kind":"prompt","text":"[same question, toggle → notes]"},{"kind":"tool","text":"assemble(mode=notes) → retrieved: 2 matched request lines · history: SESSION NOTES (structured)"},{"kind":"out-pass","text":"✓ verified · 167 input tokens · $0.000891"}],"state":{"label":"same question, same verdict","before":{"title":"TWO ASKS, ONE ANSWER KEY","view":{"type":"rows","columns":["mode","input tokens","cost","verdict"],"rows":[{"cells":["naive","1,700","$0.00549","✓ verified"]},{"cells":["notes","167","$0.000891","✓ verified"],"tone":"win"}]}}}},{"title":"The shape, not just the size","narrative":["Naive spends 95% of its input in one line: <b>retrieved 1,612</b>, the entire seeded domain dumped in as JSON so the model can go find two rows in it.","Notes has no line anywhere near that. <b>Retrieved 50</b> — the two request lines that mention M-2001. <b>History 58</b> — session notes, written outside the window and read back in. <b>System 44</b>, <b>user 15</b>. Five thin layers instead of one fat one."],"source":"bench/results/replay-fullgrid.json#Q9-naive,bench/results/replay-fullgrid.json#Q9-notes","state":{"label":"token receipt · Q9","before":{"title":"NAIVE — 1,700","view":{"type":"receipt","mode":"naive","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"highlight":["Retrieved"],"inputTotal":1700,"output":26,"cost":"$0.00549","cacheRead":"0%","verdict":"verified"}},"after":{"title":"NOTES — 167","view":{"type":"receipt","mode":"notes","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":44},{"label":"Retrieved","tokens":50},{"label":"Tool results","tokens":0},{"label":"History","tokens":58},{"label":"Your turn","tokens":15}],"highlight":["Retrieved","History"],"inputTotal":167,"output":26,"cost":"$0.000891","cacheRead":"0%","verdict":"verified"}}}},{"title":"Be honest about where the 1,533 went","narrative":["It is tempting to read this as \"memory saved 90%\". Look again at naive's history line: it is <b>0</b>. There was no transcript to replace. On a single ask, most of the drop is the <em>retrieved</em> layer narrowing from 1,612 to 50 — a select move that lives inside notes mode, not the write move itself.","So what did writing actually buy? The 58-token history layer — and the fact that it is <b>flat</b>. Raw history grows with every turn: ask ten questions in a session and naive carries ten question-and-answer pairs forward. Structured notes carry one line per ask, capped and rewritable. The write payoff is a <em>slope</em>, not a point, which is exactly why a one-ask screenshot undersells it.","This matters for how you argue for it. If you pitch external memory on a single-turn benchmark, someone will point out that a narrower retriever got most of the win. Pitch it on turn twelve."],"source":"bench/results/replay-fullgrid.json#Q9-naive,bench/results/replay-fullgrid.json#Q9-notes","state":{"label":"attributing the drop","before":{"title":"WHICH LAYER MOVED, AND WHY","view":{"type":"rows","columns":["layer","naive","notes","what did it"],"rows":[{"cells":["Retrieved","1,612","50","select — only the requests naming M-2001 ship"],"tone":"win"},{"cells":["History","0","58","<b>write</b> — structured notes read back in place of a transcript"]},{"cells":["System","65","44","a shorter system block on the notes path"]},{"cells":["Your turn","23","15","the question, restated against the notes"]},{"cells":["<b>total</b>","<b>1,700</b>","<b>167</b>","both stamped ✓ verified"]}]}}}},{"title":"What is actually in the 58 tokens","narrative":["Open the notes store and the line the app wrote after your first ask is unremarkable on purpose: <code>- asked[Q9] verdict=PASS facts=Member M-2001 has 2 authorization requests: PA-1001 APPROVED (score 100); PA-1004 MANUAL_REVIEW (score 65).</code>","Three properties do all the work. It is <b>structured</b> — a fixed shape, so the next reader knows where to look. It <b>carries identifiers</b> — PA-1001, PA-1004, MANUAL_REVIEW survive verbatim, which is precisely what the compressor in U07 fails to do. And it is <b>a fact, not a transcript</b> — no \"the user then asked\", no restated question.","Get any of the three wrong and you have not built memory, you have renamed history. Pasted conversation chunks under the heading NOTES cost the same tokens and read back worse."],"youDo":"After two or three asks in the same session, hit the notes store and read every line it has written. If a line does not contain an identifier, ask what it is for.","state":{"label":"note quality","before":{"title":"BEFORE — transcript hoarding with a new label","view":{"type":"diff","file":"session-notes.txt","lines":[["p","SESSION NOTES"],["m","- User asked about member M-2001 and I explained their history."],["m","- Then the user asked a follow-up about the review threshold."],["m","- I said it was fairly high and gave some context."]]}},"after":{"title":"AFTER — structured, identifier-bearing","view":{"type":"diff","file":"session-notes.txt","lines":[["p","SESSION NOTES (structured, written outside the window)"],["a","- asked[Q9] verdict=PASS facts=M-2001 has 2 requests: PA-1001 APPROVED (100); PA-1004 MANUAL_REVIEW (65)."],["a","- asked[Q3] verdict=PASS facts=score >= 80 APPROVED; >= 50 MANUAL_REVIEW; else DENIED."],["a","- open: PA-1004 awaits a clinician decision"]]}}}},{"title":"How it does across all ten questions","narrative":["Run the whole grid and <code>notes</code> answers all ten correctly for <b>1,968 input tokens in total</b> — the smallest total of any mode on the board, against <code>okf</code>'s 2,159 and naive's 15,262 for nine correct answers and one fabrication.","But be precise about the claim, because the two arms split the honours. By <em>median</em> okf edges it, <b>186 to 198</b>. Notes wins outright on five questions and ties a sixth; okf wins the other four — every canonical or rule-shaped question, where the answer is a stated policy rather than something that happened in this session.","That is the actual boundary of the write family: notes are for what <em>this session</em> learned. A rule that was true before you opened the app belongs in a canonical file, not a session note."],"source":"bench/results/replay-fullgrid.json#Q1-notes,bench/results/replay-fullgrid.json#Q3-notes,bench/results/replay-fullgrid.json#Q9-notes,bench/results/replay-fullgrid.json#Q10-notes","state":{"label":"notes vs okf, question by question","before":{"title":"WHERE SESSION MEMORY WINS — AND WHERE IT LOSES","view":{"type":"rows","columns":["question","class","notes","okf","cheaper"],"rows":[{"cells":["Q1","structural","141","362","notes"],"tone":"win"},{"cells":["Q2","structural","232","365","notes"],"tone":"win"},{"cells":["Q3","canonical","231","186","<b>okf</b>"],"tone":"bad"},{"cells":["Q4","canonical","143","186","notes"],"tone":"win"},{"cells":["Q5","logic","272","194","<b>okf</b>"],"tone":"bad"},{"cells":["Q6","logic","228","183","<b>okf</b>"],"tone":"bad"},{"cells":["Q7","abstention","157","157","tie"]},{"cells":["Q8","abstention","135","152","notes"],"tone":"win"},{"cells":["Q9","aggregation","167","190","notes"],"tone":"win"},{"cells":["Q10","aggregation","262","184","<b>okf</b>"],"tone":"bad"},{"cells":["<b>total · all verified</b>","","<b>1,968</b>","<b>2,159</b>","notes"]}]}}}},{"title":"The bill for keeping the sheet","narrative":["Nothing writes those notes for free. Every ask in <code>notes</code> mode pays an append, and every note you keep is a line someone has to prune, re-check, or retire. Skip the pruning and the sheet becomes a second history layer with worse formatting — the write-only failure mode.","The sharper risk is staleness. A note is asserted as fact and read back with no provenance check, so when the underlying record changes and the note does not, the model does not hedge — it states the old outcome confidently, at 167 tokens, with a receipt that looks exactly as clean as a correct one. <b>A stale note is a confident lie with a good bill.</b>","That is why U11 makes you restart the backend whenever seed data changes, and why the notes you keep should carry the identifier that lets you re-derive them. A note you cannot re-check is not memory; it is a rumour you are paying to reread."],"youDo":"Break it on purpose: ask Q9 in <code>notes</code>, change PA-1004's decision in the seed, restart the backend <em>without</em> clearing the session, and ask Q9 again. Read the answer, then read the note it came from.","terminal":[{"kind":"prompt","text":"[seed edited: PA-1004 MANUAL_REVIEW → APPROVED · backend restarted · session kept]"},{"kind":"prompt","text":"Summarize member M-2001's authorization history: how many requests and what were the outcomes?"},{"kind":"tool","text":"assemble(mode=notes) → history: - asked[Q9] verdict=PASS facts=… PA-1004 MANUAL_REVIEW (score 65)."},{"kind":"gate","text":"⏸  the note says MANUAL_REVIEW · the record now says APPROVED · nothing in the pipeline compares them"},{"kind":"out-fail","text":"the answer is stated with full confidence, and the receipt looks identical to a correct one"}],"state":{"label":"the upkeep column","before":{"title":"WHAT THE WRITE FAMILY COSTS YOU","view":{"type":"rows","columns":["cost","when it bites","the mitigation"],"rows":[{"cells":["an append on every turn","immediately — it is real work per ask","keep the note shape fixed and short"]},{"cells":["unbounded growth","around turn twenty, if you never prune","cap the sheet; retire notes that no longer bear on the task"]},{"cells":["staleness","the moment the underlying record changes","carry the identifier so the note can be re-derived, and re-derive it"],"tone":"bad"},{"cells":["no provenance on read-back","silently, forever","stamp note
