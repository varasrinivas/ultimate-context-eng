s with their source and age; treat an old note as a claim, not a fact"],"tone":"bad"}]}}}}]},{"id":"uce-retrieval","badge":"WALKTHROUGH","color":"#4A6741","time":"~6 min","title":"The wrong tool, correctly applied","spec":"U04 · retrieve wide, ship narrow — and the question class where retrieval is the mistake","intro":"Half of select is discipline: search the stacks, put three books on the desk. The other half is knowing when not to search at all. The grid has a clean case — a retrieval strategy that answers two questions perfectly for five times the price of just looking the rule up.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json"},"foot":"Do it for real: Compare drawer on <b>Q1</b> (<code>naive</code> vs <code>jit</code>), then on <b>Q4</b> (<code>graph</code> vs <code>okf</code>)","steps":[{"title":"Wide belongs in the retriever, never in the window","narrative":["Open the Compare drawer on <b>Q1</b> — <em>\"Which criteria apply to procedure 72148 and what is the weight of each?\"</em> — with <code>naive</code> on the left and <code>jit</code> on the right.","Naive is the card catalog wheeled to your desk: <b>1,694 tokens</b>, of which 1,612 are every record in the domain, serialized as JSON, so the model can go find the three rows about 72148. Jit is <b>143</b>, and its receipt splits in two: a 54-token identifier index under tool results, and 7 tokens of retrieved records — because this question names a <em>procedure</em>, not a request, so almost nothing needed injecting.","Both answers are identical and both are ✓ verified. The difference is entirely in what got onto the desk."],"youDo":"Compare drawer, pin <b>Q1</b>, left column <code>naive</code>, right column <code>jit</code>. Read the retrieved line on each.","source":"bench/results/replay-fullgrid.json#Q1-naive,bench/results/replay-fullgrid.json#Q1-jit","state":{"label":"Q1 · naive vs jit","before":{"title":"NAIVE — the whole catalog","view":{"type":"receipt","mode":"naive","question":"Q1 · criteria and weights for 72148","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":17}],"highlight":["Retrieved"],"inputTotal":1694,"output":50,"cost":"$0.005832","cacheRead":"0%","verdict":"verified"}},"after":{"title":"JIT — an index, then the shortlist","view":{"type":"receipt","mode":"jit","question":"Q1 · criteria and weights for 72148","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":7},{"label":"Tool results","tokens":54},{"label":"History","tokens":0},{"label":"Your turn","tokens":17}],"highlight":["Retrieved","Tool results"],"inputTotal":143,"output":50,"cost":"$0.001179","cacheRead":"0%","verdict":"verified"}}}},{"title":"Two postures: cap what ships, or fetch on demand","narrative":["Select shows up on the toggle bar in two different postures. <code>budgeted</code> assembles everything, then <b>evicts whole records</b> until the retrieved layer fits a cap — on Q1 that lands at 477 retrieved tokens, 559 total. Nothing is half-shipped: a record is either intact or gone, which is what keeps the surviving facts quotable.","<code>jit</code> ships an <b>index of identifiers</b> and injects only the records the question names. On Q9 you can read the two halves separately: the identifier index is the 54-token tool-results line, and the two request records it pulled in are the 78-token retrieved line. Total 220 against naive's 1,700.","Both are the same discipline — candidates are cheap, context slots are expensive. Budgeted decides at assembly time; jit defers the decision until the question has named something."],"source":"bench/results/replay-fullgrid.json#Q1-budgeted,bench/results/replay-fullgrid.json#Q9-jit","state":{"label":"the two postures, priced","before":{"title":"SAME FAMILY, DIFFERENT MOMENT OF DECISION","view":{"type":"rows","columns":["mode","question","retrieved","index / tool","input total","how it decides"],"rows":[{"cells":["naive","Q1","1,612","0","1,694","it does not decide"],"tone":"bad"},{"cells":["budgeted","Q1","477","0","559","evict whole records until it fits a cap"]},{"cells":["jit","Q1","7","54","143","index only, inject what the question names"],"tone":"win"},{"cells":["jit","Q9","78","54","220","the two M-2001 records, fetched on demand"],"tone":"win"}]}}}},{"title":"The serialization tax","narrative":["Before you tune <em>which</em> records ship, look at <em>how</em> they ship. Naive's retrieved layer is the seeded domain as pretty-printed JSON: braces, repeated field names, indentation, quoted keys on every row. Budgeted renders the same records as one flat line each and adds a policy line.","That is a formatting decision, not a retrieval decision, and it is worth a large multiple. Field names and punctuation can outweigh the facts they wrap — you can pay two tokens of scaffolding for every token of content and never notice, because the JSON looks tidy in a log.","The rule is dull and it works: ship records as the narrowest line that still carries the identifier and the fields the question needs. Keep the id verbatim; drop everything the answer key does not ask for."],"youDo":"In the U04 lab, dump both retrieved layers to a file and diff them. Count how many of naive's tokens are punctuation and repeated keys.","source":"bench/results/replay-fullgrid.json#Q1-naive,bench/results/replay-fullgrid.json#Q1-budgeted","state":{"label":"same facts, two serializations","before":{"title":"BEFORE — pretty-printed JSON","view":{"type":"diff","file":"retrieved layer (naive)","lines":[["p","FULL DOMAIN DATA (JSON):"],["m","  {"],["m","    \"id\": \"PA-1004\","],["m","    \"decision\": \"MANUAL_REVIEW\","],["m","    \"score\": 65,"],["m","    \"missing\": [\"Failed 12 weeks conservative management\"]"],["m","  },   … × every record in the domain"]]}},"after":{"title":"AFTER — one line per record","view":{"type":"diff","file":"retrieved layer (budgeted)","lines":[["p","DOMAIN DATA (budgeted, whole-record eviction, newest ids first):"],["a","PA-1004 | MANUAL_REVIEW | 65 | missing: Failed 12 weeks conservative management"],["p","POLICY: score >= 80 APPROVED; >= 50 MANUAL_REVIEW; else DENIED"]]}}}},{"title":"Where retrieval is the wrong tool","narrative":["Now run a question whose answer is not hiding anywhere. <b>Q4</b>: <em>\"What is the eligibility rule, and which plan tier covers surgical procedures?\"</em> The answer is two sentences of stated policy — ACTIVE plan status, and only PREMIUM covers surgical.","Ask it in <code>graph</code>, the relationship-walking retriever, and it costs <b>1,054 input tokens</b>. Ask it in <code>okf</code>, which loads a canonical concept file, and it costs <b>186</b>. Same answer, word for word. Same ✓ verified stamp.","Q3 — the score thresholds — tells the same story a little more quietly: <code>graph</code> 840, <code>okf</code> 186. Nothing failed here. Graph is <em>correct</em> on both. It is correct at five and a half times the price, which is its own kind of bug."],"youDo":"Compare drawer, pin <b>Q4</b>, left column <code>graph</code>, right column <code>okf</code>. Read both answers before you read either receipt.","claudeSays":"Both contexts contained the eligibility rule. One arrived with 970 tokens of graph edges wrapped around it; the other arrived as the rule.","source":"bench/results/replay-fullgrid.json#Q4-graph,bench/results/replay-fullgrid.json#Q4-okf,bench/results/replay-fullgrid.json#Q3-graph,bench/results/replay-fullgrid.json#Q3-okf","terminal":[{"kind":"prompt","text":"What is the eligibility rule, and which plan tier covers surgical procedures?"},{"kind":"tool","text":"assemble(mode=graph) → subgraphFor(q) : 970 retrieved tokens of [EXTRACTED] edges"},{"kind":"claude","text":"Eligibility: plan status must be ACTIVE and the procedure must be covered by the\nmember's plan tier (STANDARD covers diagnostics; PREMIUM covers diagnostics and surgical)."},{"kind":"out-pass","text":"✓ verified — 1,054 input tokens · $0.004152"},{"kind":"prompt","text":"[same question, toggle → okf]"},{"kind":"tool","text":"assemble(mode=okf) → canonical concepts: Determination Thresholds, Eligibility : 102 tokens"},{"kind":"out-pass","text":"✓ verified — 186 input tokens · $0.001548 · identical answer text"}],"state":{"label":"canonical questions · graph vs okf","before":{"title":"TWO CORRECT ANSWERS, FIVE TIMES THE BILL","view":{"type":"bars","unit":"input tokens","max":1054,"items":[{"label":"Q4 · graph","value":1054,"tone":"bad","note":"970 tokens of relationship edges, to state a rule"},{"label":"Q4 · okf","value":186,"tone":"win","note":"the rule, as a canonical concept file — same answer, same ✓"},{"label":"Q3 · graph","value":840,"tone":"bad","note":"756 tokens of edges for a threshold"},{"label":"Q3 · okf","value":186,"tone":"win","note":"same answer, same ✓"}]}}}},{"title":"Why the graph inflated","narrative":["This is not a mysterious retriever failure — it is a relevance test with an escape hatch. The graph assembler scans the question for entity mentions (a <code>PA-</code> id, an <code>M-</code> id, a procedure code) and for decision filters (\"manual review\", \"denied\", \"eligib\"), then renders the one-hop subgraph around whatever it found.","Q3 mentions both \"manual review\" and \"denial\", so every request with either decision gets rendered: 756 tokens of edges. Q4 mentions <b>no entity at all</b> — no request, no member, no procedure code — and the fallback branch treats <em>everything</em> as relevant. You get the whole graph, 970 tokens, because the question was too abstract to narrow on.","Read that as a general law about retrieval, not a quirk of this app: <b>a retriever with no handle to grab widens.</b> Canonical questions offer no handle by construction, which is exactly why they should never be routed to a retriever."],"source":"bench/results/replay-fullgrid.json#Q2-graph,bench/results/replay-fullgrid.json#Q3-graph,bench/results/replay-fullgrid.json#Q4-graph","state":{"label":"graph's retrieved layer, by question","before":{"title":"THE NARROWER THE HANDLE, THE SMALLER THE SUBGRAPH","view":{"type":"rows","columns":["question","what the retriever could grab","retrieved","input total"],"rows":[{"cells":["Q2 · which requests are in MANUAL_REVIEW","a decision filter — three requests","352","437"],"tone":"win"},{"cells":["Q1 · criteria for procedure 72148","a procedure code","368","450"]},{"cells":["Q3 · what are the score thresholds","\"manual review\" <em>and</em> \"denial\" — two filters, both wide","756","840"],"tone":"bad"},{"cells":["Q4 · what is the eligibility rule","<b>nothing</b> — fallback renders every node","970","1,054"],"tone":"bad"}]}}}},{"title":"Match the strategy to the question class","narrative":["The takeaway is not \"graph is bad\" — on Q2 it is the tidiest retriever on the board. It is that <b>retrieval strategy is a function of question class</b>, and you can only know the mapping by grading it.","Fuzzy questions — which records look like this, what relates to what — deserve a retriever. Settled questions — what is the threshold, what is the rule, what does the policy say — deserve a lookup, because the fact was never lost and searching for it just buys you neighbours you did not ask for.","Before you reach for retrieval at all, ask one question: is this fact <em>fuzzy enough to deserve a search</em>, or <em>settled enough to just state</em>? Get that wrong and you pay 1,054 tokens for a two-line rule, and the receipt will congratulate you with a green stamp while you do it. U12 turns this table into a router."],"youDo":"Run the full grid and build the class-to-strategy table yourself: <code>python bench/run_campaign.py --modes graph,okf,jit,budgeted</code>. Then argue with your own table.","source":"bench/results/replay-fullgrid.json","state":{"label":"class → strategy","before":{"title":"BEFORE — one retriever for everything","view":{"type":"rows","columns":["question class","strategy","input tokens"],"rows":[{"cells":["structural (Q1)","graph","450"]},{"cells":["canonical (Q3)","graph","840"],"tone":"bad"},{"cells":["canonical (Q4)","graph","1,054"],"tone":"bad"}]}},"after":{"title":"AFTER — the strategy follows the class","view":{"type":"rows","columns":["question class","strategy","input tokens","why"],"rows":[{"cells":["structural (Q1)","jit","143","the question names an entity — fetch it"],"tone":"win"},{"cells":["canonical (Q3)","okf","186","the rule is stated; look it up, do not search for it"],"tone":"win"},{"cells":["canonical (Q4)","okf","186","same — and 868 tokens cheaper than walking the graph"],"tone":"win"}]}}}}]},{"id":"uce-three-selectors","badge":"WALKTHROUGH","color":"#1F7A4D","time":"~5 min","title":"Three selectors, one question","spec":"U05 · jit vs graph vs okf","intro":"Selection is a family, not a technique. The same question, answered three different ways, all correct — and the receipts show three different shapes.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json#Q9-jit,bench/results/replay-fullgrid.json#Q9-graph,bench/results/replay-fullgrid.json#Q9-okf"},"foot":"Do it for real: pin Q9 and walk the toggle across <code>jit</code> → <code>graph</code> → <code>okf</code>","steps":[{"title":"The control: send everything","narrative":["Start where U02 left off. Naive mode answers Q9 correctly for <b>1,700 tokens</b>, 1,612 of them a dump of the entire seeded domain.","Three selectors are about to answer the same question correctly for under 300. They do it in three genuinely different ways, and knowing which one to reach for is the skill."],"source":"bench/results/replay-fullgrid.json#Q9-naive","state":{"label":"the control","before":{"title":"NAIVE — everything, just in case","view":{"type":"receipt","mode":"naive","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"inputTotal":1700,"output":26,"cost":"$0.00549","verdict":"verified"}}}},{"title":"Just-in-time — identifiers now, records on demand","narrative":["JIT sends the model a thin index: which members exist, which requests belong to whom, and a tool that fetches a full record when asked. The bulky records stay out of the prompt until something needs them.","Watch the receipt's <em>shape</em>, not just its total. Retrieved collapses from 1,612 to <b>78</b>, and a new layer appears: <b>54 tokens of tool results</b>. That trade — retrieved down, tool up — is the signature of just-in-time."],"youDo":"Set the mode toggle to <code>jit</code> and ask Q9 again.","claudeSays":"The model reads the index, sees M-2001 owns PA-1001 and PA-1004, and calls the fetch tool twice. It never sees a record it did not ask for.","terminal":[{"kind":"prompt","text":"Summarize member M-2001's authorization history…"},{"kind":"tool","text":"fetch_request(\"PA-1001\") → APPROVED, score 100"},{"kind":"tool","text":"fetch_request(\"PA-1004\") → MANUAL_REVIEW, score 65"},{"kind":"claude","text":"Member M-2001 has 2 authorization requests: PA-1001 APPROVED\n(score 100); PA-1004 MANUAL_REVIEW (score 65)."},{"kind":"out-pass","text":"✓ verified · 220 input tokens"}],"source":"bench/results/replay-fullgrid.json#Q9-jit","state":{"label":"token receipt · Q9 · jit","before":{"title":"BEFORE — naive","view":{"type":"receipt","mode":"naive","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"inputTotal":1700,"verdict":"verified"}},"after":{"title":"AFTER — jit: retrieved down, tool up","view":{"type":"receipt","mode":"jit","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":78},{"label":"Tool results","tokens":54},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"highlight":["Tool results"],"inputTotal":220,"output":26,"cost":"$0.00105","verdict":"verified","verdictNote":"87% less than naive, same answer"}}}},{"title":"Graph — the subgraph instead of the dump","narrative":["The graph selector walks relationships. It knows M-2001 is connected to two authorization nodes, pulls that neighbourhood, and sends only it. No index round-trip and no tool call — the selection happens before the model is ever invoked.","It costs <b>286 tokens</b>, a little more than JIT. It earns that on relational questions where the answer depends on <em>how</em> records connect rather than what they contain."],"youDo":"Switch to <code>graph</code>. Compare the tool layer with the JIT receipt you just read.","source":"bench/results/replay-fullgrid.json#Q9-graph","state":{"label":"token receipt · Q9 · graph","before":{"title":"GRAPH — deterministic selection, no round trip","view":{"type":"receipt","mode":"graph","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":198},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"highlight":["Retrieved"],"inputTotal":286,"output":26,"cost":"$0.00125","verdict":"verified"}}}},{"title":"OKF — one canonical file, zero search","narrative":["The canonical selector does no searching at all. Somebody already wrote the concept file for member authorization history, and it is the right size by construction. The assembler loads it and stops.","<b>190 tokens</b> — the cheapest of the three, and the only one with no moving parts at query time. The cost moved from runtime to authoring time, which is a trade you make deliberately, not a saving you get for free."],"youDo":"Switch to <code>okf</code>, then open the concept file the mode loaded and read it. That file is the whole trick.","source":"bench/results/replay-fullgrid.json#Q9-okf","state":{"label":"token receipt · Q9 · okf","before":{"title":"OKF — curated, not searched","view":{"type":"receipt","mode":"okf","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":102},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"inputTotal":190,"output":26,"cost":"$0.00096","verdict":"verified"}}}},{"title":"Three shapes, one verdict","narrative":["All three are correct. All three are roughly an order of magnitude cheaper than sending everything. They are not interchangeable: JIT pays a round trip and wins when you cannot predict what is needed; graph wins on relational questions; OKF wins when someone has already done the curation.","The lesson to carry into U06 is that <em>selection is a family</em>. \"Use retrieval\" is not a strategy. Choosing which selector fits the question class is."],"source":"bench/results/replay-fullgrid.json#Q9","state":{"label":"Q9 · all selectors","before":{"title":"MEASURED — same question, same answer key","view":{"type":"bars","unit":"tokens","max":1700,"items":[{"label":"naive","value":1700,"tone":"bad","note":"the control — everything, just in case"},{"label":"graph","value":286,"note":"subgraph · relational questions"},{"label":"jit","value":220,"note":"index + 2 tool calls · unpredictable needs"},{"label":"okf","value":190,"tone":"win","note":"one canonical file · curation done up front"}]}}}}]},{"id":"uce-cache-prefix","badge":"WALKTHROUGH","color":"#4B5FA8","time":"~5 min","title":"One changed byte","spec":"U06 · the static surface, the cached prefix, and what invalidates it","intro":"Ask Q3 in cached mode twice, then flip any toggle and ask a third time. The cache-read badge climbs, then drops to zero — and you have just watched one changed byte at the front of the prompt throw away everything prepped behind it.","provenance":{"kind":"illustrative"},"foot":"Do it for real: preset <b>Q3</b>, mode <code>cached</code>, ask twice — then change one toggle and ask again. Live mode (an API key) is what moves the badge.","steps":[{"title":"The part of context you design once","narrative":["Ask <b>Q3</b> — <em>\"What score thresholds route a request to approval, manual review, and denial?\"</em> — in <code>cached</code>. The receipt reads <b>732 input tokens</b>: system 65, retrieved 648, your turn 19. Verified.","Those 648 tokens are not one thing. The assembler builds them in two blocks and in a deliberate order: first <b>POLICY (static)</b> and <b>PROCEDURE CATALOG (static)</b> — content that is identical on every single call you will ever make — then <b>CURRENT REQUESTS</b>, which changes whenever the queue does.","That split is the whole subject of this module. The system prompt, the tool schemas, the canonical examples, the policy, the catalog: you design them once and then pay for them on every call for the rest of the product's life. That is rent, and ordering decides how much of it you can stop paying."],"youDo":"Pin <b>Q3</b>, set the mode to <code>cached</code>, and ask. Note the retrieved line: 648.","source":"bench/results/replay-fullgrid.json#Q3-cached","state":{"label":"token receipt · Q3 · cached","before":{"title":"ONE CALL, TWO KINDS OF CONTENT","view":{"type":"stack","views":[{"type":"receipt","mode":"cached","question":"Q3 · score thresholds","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":648},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":19}],"highlight":["System","Retrieved"],"inputTotal":732,"output":30,"cost":"$0.002938","cacheRead":"0%","verdict":"verified"},{"type":"rows","columns":["block","changes when…","cacheable?"],"rows":[{"cells":["system prompt (65)","you redeploy","yes — stable prefix"],"tone":"win"},{"cells":["POLICY (static)","the plan rules change, i.e. rarely","yes"],"tone":"win"},{"cells":["PROCEDURE CATALOG (static)","a procedure is added","yes"],"tone":"win"},{"cells":["CURRENT REQUESTS","any clinician touches the queue","no — volatile suffix"]},{"cells":["your question (19)","every call","no — and it belongs last"]}]}]}}}},{"title":"Ask it a second time","narrative":["Ask the identical question again, same mode, nothing touched in between. The token count does not move — you are still sending 732 tokens — but the <b>cache read</b> badge on the receipt stops saying 0%. The stable prefix was written to the cache on the first call and read back on the second.","This is why caching is not a compression technique and does not belong in the four families. Nothing got smaller. The same bytes were re-sent and billed differently, because a cache read is charged well below a fresh input token while a cache write costs a shade more than one. You are paying for <em>position</em>, not for <em>size</em>.","One honesty note before you go looking: the recorded grid this course ships shows <code>cache_read = 0</code> on all 100 rows, because replay mode never calls the API and so never touches a real cache. The badge only moves when you run the app live with a key. The token totals below are measured; the cache behaviour is what the live run demonstrates."],"youDo":"Ask <b>Q3</b> in <code>cached</code> twice in a row and watch only the cache-read chip on the two receipts.","state":{"label":"two identical calls","before":{"title":"CALL 1 — the prefix is written","view":{"type":"receipt","mode":"cached","question":"Q3 · score thresholds","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":648},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":19}],"inputTotal":732,"output":30,"cost":"$0.002938","cacheRead":"0%","verdict":"verified","verdictNote":"cold — nothing to read yet"}},"after":{"title":"CALL 2 — the prefix is read","view":{"type":"receipt","mode":"cached","question":"Q3 · score thresholds","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":648},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":19}],"highlight":["System","Retrieved"],"inputTotal":732,"output":30,"cost":"cheaper — same tokens","cacheRead":"HIT — static prefix","verdict":"verified","verdictNote":"identical bytes, identical answer, different bill"}}}},{"title":"Now change one byte","narrative":["Flip any toggle and ask again. The badge goes back to <b>0%</b>. Not reduced — zero. Cache matching is a prefix match: it walks from position zero and stops at the first byte that differs, and everything from there on is a miss.","That is the whole failure mode, and it is why the classic anti-pattern is so expensive. Put a timestamp — or a session id, or a user name, or a randomly-ordered tool list — anywhere near the front of your prompt and you have invalidated every stable token behind it, on every call, forever. Your cache-hit rate reads 0% and nothing in the response looks wrong.","The prep-kitchen version: one cook relabels a container at the front of the line mid-service. The cost is not the relabelling. The cost is that every station behind it has to re-check its own work."],"youDo":"With Q3 still pinned, switch to any other mode, then switch back to <code>cached</code> and ask again. Read the badge.","claudeSays":"Nothing about the request was semantically different. The byte sequence changed at a position ahead of the stable content, so the prefix no longer matched.","terminal":[{"kind":"prompt","text":"[ask #2 — cached, unchanged]"},{"kind":"out-pass","text":"cache read: HIT — the static prefix was served from cache"},{"kind":"prompt","text":"[toggle changed, then back to cached — ask #3]"},{"kind":"gate","text":"⏸  prefix match walks from position 0 … first differing byte at the top of the assembled prompt"},{"kind":"out-fail","text":"cache read 0% — every token behind the change re-billed at full input rate"}],"state":{"label":"the invalidation","before":{"title":"BEFORE — a clean prefix","view":{"type":"diff","file":"assembled prompt (head)","lines":[["p","SYSTEM: You are a prior-authorization assistant. …"],["p","POLICY (static): score >= 80 APPROVED; >= 50 MANUAL_REVIEW; else DENIED"],["p","PROCEDURE CATALOG (static): 72148 MRI Lumbar Spine · 29881 Knee Arthroscopy · …"],["p","CURRENT REQUESTS: PA-1002 … PA-1004 … PA-1010 …"]]}},"after":{"title":"AFTER — one volatile token at the front","view":{"type":"diff","file":"assembled prompt (head)","lines":[["a","SYSTEM: You are a prior-authorization assistant. Current time: 2026-08-28T14:31:07Z"],["m","POLICY (static): …            ← still identical, still re-billed"],["m","PROCEDURE CATALOG (static): …  ← still identical, still re-billed"],["m","CURRENT REQUESTS: …            ← never was cacheable anyway"]]}}}},{"title":"The ordering rule","narrative":["The fix is not clever, which is why it gets skipped: <b>stable content first, volatile content last</b>, with no exceptions for convenience. System prompt, then tool schemas, then canonical examples, then the policy and catalog blocks, then whatever changes per call, then the user's turn.","Read the <code>cached</code> assembler and that is literally all it does differently from <code>naive</code>: it emits the static block, then the dynamic block, and marks the boundary as cacheable. Same facts, same model, a different order.","Every timestamp, id, counter, or \"helpful\" per-call preamble you were going to put at the top has a home at the bottom instead. If a value must be near the front for the model to behave, that is a prompt-design problem to solve once — not a reason to burn the cache on every call."],"youDo":"Print your own assembled prompt and mark each block <code>STATIC</code> or <code>VOLATILE</code>. If any VOLATILE line appears above a STATIC one, you have found your cache leak.","state":{"label":"assembly order","before":{"title":"BEFORE — convenient order","view":{"type":"diff","file":"assembler/cached.py","lines":[["p","def build(question, session):"],["m","    parts = [f\"Session {session} at {now()}\"]   # volatile, at position zero"],["m","    parts += [SYSTEM, policy_line(), procedures_text()]"],["m","    parts += [current_requests(), question]"],["m","    return \"\\n\\n\".join(parts)                   # cache hit rate: 0%, always"]]}},"after":{"title":"AFTER — static-first, boundary marked","view":{"type":"diff","file":"assembler/cached.py","lines":[["p","def build(question, session):"],["a","    static  = [SYSTEM, tool_schemas(), canonical_examples(),"],["a","               policy_line(), procedures_text()]      # identical on every call"],["a","    dynamic = [current_requests(), f\"Session {session} at {now()}\", question]"],["a","    return cacheable(static) + \"\\n\\n\" + \"\\n\\n\".join(dynamic)"]]}}}},{"title":"A lint you can write in twenty lines","narrative":["Cache leaks are invisible in output and cheap to detect, which makes them a perfect thing to automate. Assemble the same prompt twice with different inputs, diff the two, and find the position of the first differing byte. Everything before it is your real cacheable prefix; everything you <em>thought</em> was cacheable after it is rent you are still paying.","Then assert on it. If the stable prefix is shorter than the static content you designed, fail the build — a regression that pushes a timestamp up by one line should break CI, not quietly triple your bill next quarter.","Run it against your own agent before you tune anything else. It is the highest-yield twenty lines in this module."],"youDo":"Write <code>lint_cacheability.py</code>: assemble twice with different questions, find the first divergent index, and assert it is at least as long as your declared static surface.","terminal":[{"kind":"prompt","text":"python lint_cacheability.py --mode cached"},{"kind":"out","text":"declared static surface : 713 chars (system + tools + policy + catalog)"},{"kind":"out","text":"measured stable prefix  :  38 chars"},{"kind":"out-fail","text":"✕ FAIL — prefix diverges at char 38: 'Current time: 2026-08-28T14:31:07Z'"},{"kind":"out","text":"hint: move volatile values below the static block"},{"kind":"prompt","text":"python lint_cacheability.py --mode cached   # after the fix"},{"kind":"out-pass","text":"✓ PASS — measured stable prefix 713 chars ≥ declared 713"}],"state":{"label":"what the lint measures","before":{"title":"TWO ASSEMBLIES, ONE DIVERGENCE POINT","view":{"type":"rows","columns":["check","before","after"],"rows":[{"cells":["declared static surface","713 chars","713 chars"]},{"cells":["measured stable prefix","38 chars","713 chars"]},{"cells":["first divergence","a timestamp in the system block","the CURRENT REQUESTS block — correct"]},{"cells":["build gate","✕ FAIL","✓ PASS"],"tone":"win"}]}}}},{"title":"Caching is not the cheapest arm, and never was","narrative":["Now the honest part. Across the ten graded questions, <code>cached</code> answers all ten correctly with a median of <b>731 input tokens</b> — and it is beaten on token count by <code>okf</code> (186), <code>notes</code> (198), <code>compressed</code> (231), <code>jit</code> (251) and <code>graph</code> (444). On Q3 specifically it sends 732 tokens where okf sends 186.","That is not a defect; it is the point. Caching optimises the <em>cost of a position</em>, not the number of tokens in it. A cached 732-token prompt is cheaper per call than an uncached 732-token prompt, and still four times bigger than it needed to be.","So do both, in this order. Shrink the surface first with the select and write families, then order what survives static-first so the cache pays the rent on the part you genuinely cannot remove. Caching a bloated prompt is a discount on a bad decision."],"source":"bench/results/replay-fullgrid.json#Q3-cached,bench/results/replay-fullgrid.json#Q3-okf,bench/results/replay-fullgrid.json#Q3-notes,bench/results/replay-fullgrid.json#Q3-jit","state":{"label":"Q3 · cached against the field","before":{"title":"ALL VERIFIED — CACHED IS NOT THE SMALL ONE","view":{"type":"rows","columns":["mode","Q3 input tokens","mode median","verdict"],"rows":[{"cells":["okf","186","186","✓ verified"],"tone":"win"},{"cells":["notes","231","198","✓ verified"],"tone":"win"},{"cells":["compressed","234","231","✓ verified on Q3"]},{"cells":["jit","285","251","✓ verified"]},{"cells":["graph","840","444","✓ verified"]},{"cells":["cached","732","731","✓ verified — cheaper per call, not per token"],"tone":"bad"},{"cells":["naive","1,696","1,696","✓ verified on Q3"]}]}}}}]},{"id":"uce-savings-void","badge":"WALKTHROUGH","color":"#A63A3A","time":"~5 min","title":"Savings void","spec":"U07 · the compression that fails its answer key","intro":"The cheapest answer on the whole grid for this question is also wrong. Watch a 88% saving get voided by one missing fact, and learn the assertion that catches it.","provenance":{"kind":"measured","source":"bench/results/teaching-failures.json#Q9-compressed"},"foot":"Do it for real: Compare drawer, Q9, <code>budgeted</code> vs <code>compressed</code>","steps":[{"title":"Two compressors, same question","narrative":["Budgeted and compressed are both COMPRESS-family strategies, and they attack the same layer. They differ in <em>how</em>: budgeted evicts whole records until it fits a cap; compressed rewrites records into a shorter abstract.","On Q9 — summarize M-2001's authorization history — budgeted lands at 565 tokens and compressed at 208. On tokens alone, compressed wins by a mile."],"youDo":"Open the Compare drawer, pin <b>Q9</b>, and set the two columns to <code>budgeted</code> and <code>compressed</code>.","source":"bench/results/replay-fullgrid.json#Q9-budgeted,bench/results/replay-fullgrid.json#Q9-compressed","state":{"label":"tokens only — the tempting view","before":{"title":"IF YOU ONLY LOOK AT THE BILL","view":{"type":"bars","unit":"tokens","max":1700,"items":[{"label":"naive","value":1700,"note":"the control"},{"label":"budgeted","value":565,"note":"evicts whole records to fit a cap"},{"label":"compressed","value":208,"tone":"win","note":"rewrites records into an abstract — 88% off"}]}}}},{"title":"Read the two answers, not the two totals","narrative":["Budgeted says: two requests, PA-1001 approved at score 100, PA-1004 in manual review at score 65. Correct.","Compressed says: two requests, PA-1001 approved, <em>\"her history shows consistent approvals.\"</em> The abstract step summarised away the request that was <b>not</b> approved — and then editorialised in its place."],"claudeSays":"Nothing went wrong in the model. The compressor handed it a context in which PA-1004's outcome no longer existed, and it answered faithfully from what it was given.","terminal":[{"kind":"prompt","text":"Summarize member M-2001's authorization history…"},{"kind":"tool","text":"assemble(mode=compressed) → abstract(records) : 1,612 → 120 tokens"},{"kind":"claude","text":"Member M-2001 (Rosa Delgado) has 2 authorization requests:\nPA-1001 was APPROVED. Her history shows consistent approvals."},{"kind":"gate","text":"⏸  GRADING against the Q9 answer key"},{"kind":"out-fail","text":"✕ FAILED — missing required facts: PA-1004, MANUAL_REVIEW"}],"source":"bench/results/teaching-failures.json#Q9-compressed","state":{"label":"the two answers","before":{"title":"BUDGETED — 565 tokens","view":{"type":"note","text":"\"Member M-2001 has 2 authorization requests: PA-1001 APPROVED (score 100); PA-1004 MANUAL_REVIEW (score 65).\" — both required facts present."}},"after":{"title":"COMPRESSED — 208 tokens","view":{"type":"stack","views":[{"type":"note","text":"\"Member M-2001 (Rosa Delgado) has 2 authorization requests: PA-1001 was APPROVED. Her history shows consistent approvals.\""},{"type":"rows","columns":["required fact","present?"],"rows":[{"cells":["PA-1001 · APPROVED","yes"],"tone":"win"},{"cells":["PA-1004","<b>missing</b>"],"tone":"bad"},{"cells":["MANUAL_REVIEW","<b>missing</b>"],"tone":"bad"}]}]}}}},{"title":"The stamp that voids the saving","narrative":["The receipt does not congratulate compressed on 208 tokens. It stamps it <b>✕ FAILED — savings void</b> and names the facts that went missing.","This is the one rule the whole course rests on: <b>a saving that changes the answer is not a saving.</b> It is a defect with a smaller bill. In a prior-authorization system, \"consistent approvals\" about a member with a pending manual review is not a rounding error — it is the wrong clinical picture."],"source":"bench/results/teaching-failures.json#Q9-compressed","state":{"label":"token receipt · Q9 · compressed","before":{"title":"THE CHEAPEST WRONG ANSWER ON THE GRID","view":{"type":"receipt","mode":"compressed","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":120},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"inputTotal":208,"output":26,"cost":"$0.00101","cacheRead":"0%","verdict":"failed","verdictNote":"missing: PA-1004 · MANUAL_REVIEW"}}}},{"title":"The fidelity assertion","narrative":["The fix is not \"compress less\". It is to make compression <b>prove</b> it kept what mattered. Before an abstract is allowed into the context, assert that every identifier and status present in the source survives into the summary.","Turn the assertion on and compressed stops returning a cheap wrong answer — it returns a slightly more expensive right one, because the assertion forces the outcome fields to be carried verbatim."],"youDo":"In the U07 lab, break it on purpose: disable the assertion, re-ask Q9, and watch the FAILED stamp come back.","state":{"label":"compression with a contract","before":{"title":"BEFORE — abstract with no contract","view":{"type":"diff","file":"assembler/compress.py","lines":[["p","def abstract(records):"],["p","    text = summarize(records)"],["m","    return text            # ships whatever the summariser produced"]]}},"after":{"title":"AFTER — the fidelity assertion","view":{"type":"diff","file":"assembler/compress.py","lines":[["p","def abstract(records):"],["p","    text = summarize(records)"],["a","    required = ids_and_statuses(records)   # PA-1004, MANUAL_REVIEW, …"],["a","    missing  = [f for f in required if f not in text]"],["a","    if missing:"],["a","        return extract_verbatim(records, keep=missing)  # fall back a rung"],["p","    return text"]]}}}},{"title":"What to take to the router","narrative":["Compression is not disqualified — it is <em>conditional</em>. On questions whose answer is a shape rather than a set of identifiers, abstracting is exactly right. On aggregation questions with named facts in the key, it is the most dangerous strategy on the toggle bar.","That distinction, made per question class from measured evidence, is what U12's router is built out of. Never route to an arm that fails the key on that class — however good its tokens look."],"source":"bench/results/replay-fullgrid.json#Q9","state":{"label":"Q9 · tokens with the verdict attached","before":{"title":"THE ONLY TABLE THAT COUNTS","view":{"type":"rows","columns":["mode","input tokens","verdict","eligible for routing?"],"rows":[{"cells":["compressed","208","✕ FAILED","no — savings void"],"tone":"bad"},{"cells":["notes","167","✓ verified","yes"],"tone":"win"},{"cells":["okf","190","✓ verified","yes"],"tone":"win"},{"cells":["jit","220","✓ verified","yes"]},{"cells":["budgeted","565","✓ verified","yes"]},{"cells":["naive","1,700","✓ verified","yes, but why"]}]}}}}]},{"id":"uce-compaction","badge":"WALKTHROUGH","color":"#33506B","time":"~5 min","title":"Turn 34, and the window isn't full","spec":"U08 · compaction, and the audit of what survived it","intro":"A review session degrades at 31% window utilisation, gets compacted, and then gets audited: which decisions and open issues survived the collapse, and which one quietly dissolved.","provenance":{"kind":"illustrative"},"foot":"Do it for real: ask Q1, Q3, Q6 and Q9 in one <code>naive</code> session and watch the sparkline climb; refresh and repeat in <code>notes</code>.","steps":[{"title":"The session is failing at 31% full","narrative":["A reviewer has been working the MedFlow queue for thirty-four turns. Nothing has errored, the window is nowhere near its limit — and at turn 31 the copilot re-asked a question that was answered at turn 6.","This is <strong>context rot</strong> in its session form. The failure axis is signal-to-noise, not size: the answer is still in the window, buried under twenty-eight turns of tool dumps, resolved detours and pleasantries. A bigger window buries it deeper."],"youDo":"Open the session strip and read the sparkline rather than the last answer. The shape of the curve is the diagnosis.","state":{"label":"session window · turn 34 · naive","before":{"title":"ILLUSTRATIVE — a long session, nowhere near the limit","view":{"type":"window","label":"200K window · turn 34","capacity":200000,"layers":[{"label":"System","tokens":65},{"label":"Retrieved (re-sent each turn)","tokens":1612},{"label":"History (28 prior turns)","tokens":58900},{"label":"Tool dumps","tokens":1440},{"label":"Your turn","tokens":23}],"highlight":["History (28 prior turns)"],"note":"31% full and already re-asking answered questions. Capacity was never the constraint — this is an illustrative session shape, not a bench cell."}}}},{"title":"Why the curve climbs and never comes down","narrative":["The single-call receipts do show the engine of the climb. In <code>naive</code> mode every call re-sends the whole domain dump: Q1's retrieved layer is <b>1,612 tokens</b>, and so is Q3's, Q6's, and Q9's. That block is re-paid on every turn, and the history layer is added on top of it.","So the naive session cost is not the median of its receipts — it is the sum, plus a history term that grows quadratically with turn count. The four bench questions alone re-carry the same 1,612-token dump four times over."],"claudeSays":"Nothing decides to forget. An append-only session has no eviction policy, so every turn's material is still competing for attention on turn 34.","source":"bench/results/replay-fullgrid.json#Q1-naive,bench/results/replay-fullgrid.json#Q9-naive","state":{"label":"measured — the block that repeats","before":{"title":"MEASURED — naive's retrieved layer, four questions","view":{"type":"rows","columns":["question","retrieved layer","input total","verdict"],"rows":[{"cells":["Q1 · criteria for 72148","1,612","1,694","✓ PASS"]},{"cells":["Q3 · score thresholds","1,612","1,696","✓ PASS"]},{"cells":["Q6 · why PA-1004 went to review","1,612","1,693","✓ PASS"]},{"cells":["Q9 · summarize M-2001","1,612","1,700","✓ PASS"]},{"cells":["<b>same dump, paid four times</b>","<b>6,448</b>","<b>6,783</b>","and that is before history"],"tone":"bad"}]}}}},{"title":"Compact: rewrite the case board","narrative":["Compaction distils the transcript-so-far into a summary and replaces the raw history with it. What must survive is precise: <b>decisions made</b>, <b>open issues</b>, and <b>load-bearing identifiers</b>. What is meant to dissolve: resolved detours, duplicate tool dumps, and conversation about the conversation.","Run it as its own clean call. Asking the main model to summarise the very context it is drowning in is the classic own-goal — the compactor inherits the rot it was hired to remove."],"youDo":"Trigger compaction on a cadence, not at the cliff — the compactor needs a healthy context to do its job.","terminal":[{"kind":"prompt","text":"/compact --keep-recent 2"},{"kind":"tool","text":"compact(turns=34, keep_recent=2) → clean call, not in-session"},{"kind":"out","text":"extracted  3 decisions, 2 open items, 7 load-bearing ids"},{"kind":"out","text":"discarded 21 routine turns (chatter, resolved detours, tool dumps)"},{"kind":"out-pass","text":"✓ history 58,900 → 640 tokens · 2 recent turns kept verbatim"}],"state":{"label":"the strip flattens","before":{"title":"BEFORE — turn 34, append-only","view":{"type":"window","label":"200K window · before compaction","capacity":200000,"layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"History (28 prior turns)","tokens":58900},{"label":"Tool dumps","tokens":1440},{"label":"Your turn","tokens":23}],"highlight":["History (28 prior turns)"],"note":"Illustrative session shape."}},"after":{"title":"AFTER — the case board plus two recent turns","view":{"type":"window","label":"200K window · after compaction","capacity":200000,"layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Case board (compacted)","tokens":640},{"label":"Recent 2 turns","tokens":310},{"label":"Your turn","tokens":23}],"highlight":["Case board (compacted)"],"note":"The flattening is the point. What you must now prove is that the collapse kept the load-bearing content."}}}},{"title":"The audit: what survived, what dissolved","narrative":["Compaction is a lossy operation you performed on your own memory, so it needs the same scrutiny as U07's compressors. Do not read the summary and nod at it — audit it against a list of things that were <em>required</em> to survive.","The audit has three tiers. Decisions and open issues must survive verbatim. Load-bearing identifiers — request ids, member ids, scores — must appear literally, because a paraphrase of <code>PA-1004</code> is not <code>PA-1004</code>. Everything else is allowed to go, and most of it should."],"state":{"label":"compaction audit · turn 34","before":{"title":"ILLUSTRATIVE — the survival audit","view":{"type":"rows","columns":["content","tier","survived?"],"rows":[{"cells":["PA-1002: wait for the EMG before re-scoring","decision","✓ verbatim"],"tone":"win"},{"cells":["PA-1010: borderline at 50 — keep in review","decision","✓ verbatim"],"tone":"win"},{"cells":["M-2002 is STANDARD tier, surgical not covered","load-bearing id","✓ verbatim"],"tone":"win"},{"cells":["Eligibility confusion — resolved, tier covers it","resolved detour","dissolved (correct)"]},{"cells":["4KB of raw queue JSON, re-read three times","tool dump","dissolved (correct)"]},{"cells":["\"ok next\" · \"thanks\" · \"looking at the queue\"","chatter","dissolved (correct)"]},{"cells":["PA-1004: conservative-management window ends 2026-09-23","<b>open issue</b>","<b>✕ dissolved</b>"],"tone":"bad"}]}}}},{"title":"The open issue that dissolved","narrative":["The summariser kept both decisions and rewrote the open items as <em>\"a few requests remain pending review\"</em> — accurate, fluent, and useless. PA-1004 has a deadline attached to it; \"a few requests\" does not.","This is exactly the shape of U07's voided saving, moved from the retrieved layer to the history layer. A compaction that loses an open issue has not compressed the session; it has closed it. So compaction gets the same treatment compression got: an assertion that runs before the board is allowed to replace the transcript."],"youDo":"Break it on purpose in the U08 lab: compact away an open item and watch the assertion refuse the board.","terminal":[{"kind":"tool","text":"compact(turns=34) → board 640 tokens"},{"kind":"gate","text":"⏸  ASSERT — every decision and open item present verbatim"},{"kind":"out-fail","text":"✕ compaction lost: 'PA-1004: conservative-management window ends 2026-09-23'\n         board REFUSED — history left intact, compaction retried with open items pinned"}],"state":{"label":"the compactor, with a contract","before":{"title":"BEFORE — ships whatever the summariser produced","view":{"type":"diff","file":"session/compact.py","lines":[["p","def compact(turns, keep_recent=2):"],["p","    old, recent = turns[:-keep_recent], turns[-keep_recent:]"],["p","    board = summarize(old)"],["m","    return [{'kind': 'summary', 'text': board}] + recent"]]}},"after":{"title":"AFTER — decisions and open items must survive verbatim","view":{"type":"diff","file":"session/compact.py","lines":[["p","def compact(turns, keep_recent=2):"],["p","    old, recent = turns[:-keep_recent], turns[-keep_recent:]"],["p","    board = summarize(old)"],["a","    for t in old:"],["a","        if t.get('kind') in ('decision', 'open'):"],["a","            assert t['text'] in board, f\"compaction lost: {t['text']!r}\""],["p","    return [{'kind': 'summary', 'text': board}] + recent"]]}}}},{"title":"What the single-call receipts can and cannot tell you","narrative":["Be honest about the evidence. The shipped grid is <b>single-call</b>: one question, one assembly, one receipt. It cannot measure multi-turn pressure at all, which is why this walkthrough's session numbers are labelled illustrative rather than dressed up as bench cells.","What the grid <em>can</em> show is the destination compaction is heading toward. The <code>notes</code> arm keeps its established facts outside the window and loads them back as a small history layer: Q1 answers at <b>141 tokens</b>, of which only <b>64</b> is history, and the arm holds a <b>197.5-token median at 10/10 correct</b> against naive's 1,696 at 9/10. Compaction bends the curve; notes moves the memory off the curve entirely.","The rule to carry into U09: compaction preserves the <em>thread</em>, notes preserve the <em>facts</em>. Pick by task shape — a clinician arguing one borderline determination wants the thread; a reviewer clearing a queue wants the facts."],"source":"bench/results/replay-fullgrid.json#Q1-notes,bench/results/replay-fullgrid.json#Q1-naive","state":{"label":"measured — Q1, naive vs notes","before":{"title":"MEASURED — naive re-sends the world","view":{"type":"receipt","mode":"naive","question":"Q1 · criteria and weights for 72148","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":17}],"inputTotal":1694,"output":50,"cost":"$0.005832","cacheRead":"0%","verdict":"verified","verdictNote":"correct — and re-paid on every turn of the session"}},"after":{"title":"MEASURED — notes carries facts, not transcript","view":{"type":"receipt","mode":"notes","question":"Q1 · criteria and weights for 72148","layers":[{"label":"System","tokens":37},{"label":"Retrieved","tokens":31},{"label":"Tool results","tokens":0},{"label":"History","tokens":64},{"label":"Your turn","tokens":9}],"inputTotal":141,"output":50,"cost":"$0.001173","cacheRead":"0%","verdict":"verified","verdictNote":"10/10 correct across the grid · 197.5-token median","highlight":["History"]}}}}]},{"id":"uce-isolate","badge":"WALKTHROUGH","color":"#B45309","time":"~5 min","title":"The junior's bill","spec":"U09 · isolation, and the tokens it honestly costs","intro":"Isolation is the most expensive arm on the whole grid — more expensive than sending everything. Read the receipt that proves it, understand exactly where the tokens went, and learn the task shape where the price inverts.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json#Q9-isolated"},"foot":"Do it for real: ask <b>Q9</b> in <code>isolated</code> and read the receipt's tool line.","steps":[{"title":"Send the junior to the archives","narrative":["<strong>Isolate</strong> is the fourth strategy: give a sub-agent its own clean window, let it do the messy work, and hand only the conclusion back to the parent. The exploration — forty records read, three dead ends, two re-reads — never crosses the threshold into the parent's context.","MedFlow's <code>isolated</code> mode implements the honest version. A second model call receives a minimal clean context for the data-gathering subtask, and its bounded summary — not its working — feeds the answering call. Crucially, the sub-call's tokens are billed to the parent's <em>tool</em> layer, so the price is on the receipt rather than hidden in another window."],"youDo":"Switch the mode toggle to <code>isolated</code> and ask <b>Q9</b>: <em>\"Summarize member M-2001's authorization history.\"</em>","terminal":[{"kind":"prompt","text":"Summarize member M-2001's authorization history: how many requests and what were the outcomes?"},{"kind":"tool","text":"assemble(mode=isolated) → spawn sub-agent, charter: \"M-2001 authorization history\""},{"kind":"tool","text":"sub-agent: clean window, reads requests, returns memo → billed to tool layer"},{"kind":"claude","text":"Member M-2001 has 2 authorization requests: PA-1001 APPROVED (score 100);\nPA-1004 MANUAL_REVIEW (score 65)."},{"kind":"out-pass","text":"✓ verified — all key facts present"}]},{"title":"The receipt nobody wants to publish","narrative":["The answer is correct. The bill is <b>1,796 input tokens</b> — against <code>notes</code> at 167 and <code>naive</code> at 1,700 for the same question. Isolation did not save anything here; it cost slightly more than sending the entire domain dump.","Note the second line of the bill too: the output is <b>52 tokens against every other arm's 26</b>. Two completions were generated — the sub-agent's memo and the parent's answer — and both are billed. Isolation buys two clean windows and pays for two calls."],"source":"bench/results/replay-fullgrid.json#Q9-isolated,bench/results/replay-fullgrid.json#Q9-notes","state":{"label":"token receipt · Q9 · isolated","before":{"title":"MEASURED — the most expensive correct answer on the grid","view":{"type":"receipt","mode":"isolated","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":64},{"label":"Retrieved","tokens":0},{"label":"Tool results (the sub-agent)","tokens":1710},{"label":"History","tokens":0},{"label":"Your turn","tokens":22}],"inputTotal":1796,"output":52,"cost":"$0.006168","cacheRead":"0%","verdict":"verified","verdictNote":"correct — and 10.8x the tokens of the notes arm's correct answer","highlight":["Tool results (the sub-agent)"]}},"after":{"title":"MEASURED — the same question, notes arm","view":{"type":"receipt","mode":"notes","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":44},{"label":"Retrieved","tokens":50},{"label":"Tool results","tokens":0},{"label":"History","tokens":58},{"label":"Your turn","tokens":15}],"inputTotal":167,"output":26,"cost":"$0.000891","cacheRead":"0%","verdict":"verified","verdictNote":"same verdict, one call, 167 tokens"}}}},{"title":"Where the tokens actually went","narrative":["Read the layer breakdown across all ten isolated cells and the mechanism is unmistakable: <b>retrieved is 0 on every single row</b>, and the tool layer carries 1,696–1,757 tokens. The parent window really is clean — it never sees a domain dump. The sub-agent's window is where the mess went, and that window is billed to the tool layer.","So the honest sentence is not \"isolation is expensive\". It is: <em>isolation moves the cost from the parent's retrieved layer into the parent's tool layer, and on a single-shot question it adds a second call's worth on top.</em> Across the whole grid, isolated totals <b>18,040 input tokens</b> against naive's <b>16,948</b> — 6.4% more than the control arm that sends everything."],"claudeSays":"Nothing went wrong. The sub-agent explored, summarised, and handed back; the parent answered from the memo. The receipt simply refuses to pretend the sub-call was free.","source":"bench/results/replay-fullgrid.json#Q1-isolated,bench/results/replay-fullgrid.json#Q10-isolated","state":{"label":"measured — every isolated row","before":{"title":"MEASURED — retrieved 0, tool ~1,700, on all ten","view":{"type":"rows","columns":["question","retrieved","tool (sub-agent)","input total","verdict"],"rows":[{"cells":["Q1 · structural","0","1,729","1,808","✓ PASS"]},{"cells":["Q4 · canonical","0","1,748","1,828","✓ PASS"]},{"cells":["Q5 · logic","0","1,757","1,845","✓ PASS"]},{"cells":["Q7 · abstention","0","1,699","1,770","✓ PASS"]},{"cells":["Q9 · aggregation","0","1,710","1,796","✓ PASS"]},{"cells":["Q10 · aggregation","0","1,723","1,802","✓ PASS"]},{"cells":["<b>median</b>","<b>0</b>","—","<b>1,805</b>","<b>10/10 correct</b>"],"tone":"bad"}]}}}},{"title":"The course ships the loss instead of hiding it","narrative":["Isolated's median is <b>1,805 tokens against naive's 1,696</b>, at identical 10/10 correctness for the arms that pass. That number could have been buried — fold the sub-call into another window, report only the parent's input, and isolation would look like a 96-token miracle.","It stays on the board for the same reason <code>compressed</code>'s Q9 failure stays on the board. A benchmark that only shows wins is marketing. And the loss carries information: it tells you the exact task shape isolation is worst at, which is the shape this grid measures — one question, one answer, nothing reused."],"source":"bench/results/replay-fullgrid.json#Q9","state":{"label":"Q9 · tokens with the verdict attached","before":{"title":"MEASURED — the aggregation question across the grid","view":{"type":"bars","unit":"tokens","max":1800,"items":[{"label":"notes","value":167,"tone":"win","note":"✓ verified"},{"label":"okf","value":190,"note":"✓ verified"},{"label":"compressed","value":208,"tone":"bad","note":"✕ FAILED — dropped PA-1004, MANUAL_REVIEW"},{"label":"jit","value":220,"note":"✓ verified"},{"label":"graph","value":286,"note":"✓ verified"},{"label":"budgeted","value":565,"note":"✓ verified"},{"label":"naive","value":1700,"note":"✓ verified — the control"},{"label":"isolated","value":1796,"tone":"bad","note":"✓ verified, and dearer than the control"}]}}}},{"title":"Where the price inverts","narrative":["Invert the task shape and the arithmetic flips. The sub-agent's exploration never enters the parent window, so it never <em>compounds</em>: on turn twelve the parent is still carrying a memo, while a naive session is re-carrying every dump it ever pulled plus twelve turns of history (U08's climbing curve).","Three conditions make isolation pay: the exploration is much bigger than the conclusion; the conclusion will be <b>referenced again</b>; and the exploration would otherwise pollute the parent's attention budget for the rest of the session. Parallelism is the fourth — three sub-agents reading three members concurrently return three memos, and the parent pays three memos rather than three transcripts, forever after.","Be precise about what the grid does and does not prove here. The shipped <code>isolated</code> mode re-runs the sub-agent on every question, so <em>this grid never measures amortisation at all</em> — it measures the worst case ten times. The break-even curve below is illustrative; computing it on your own session is the U09 lab."],"state":{"label":"the break-even, illustrated","before":{"title":"ILLUSTRATIVE — one question vs a twelve-turn session","view":{"type":"rows","columns":["task shape","naive","isolated (memo retained)","who wins"],"rows":[{"cells":["1 question, nothing reused","1,700","1,796","naive — measured, Q9"],"tone":"bad"},{"cells":["4 follow-ups on the same memo","~7,000 and climbing","~1,796 + 4 small calls","isolation"]},{"cells":["12-turn session, history compounding","re-carries every dump + history","parent never saw the dumps","isolation, decisively"],"tone":"win"},{"cells":["3 members explored in parallel","3 full transcripts in one window","3 memos in one window","isolation"],"tone":"win"}]}}}},{"title":"The hand-back contract is the technique","narrative":["None of that arithmetic exists without a bounded hand-back. A sub-agent that returns its whole exploration has re-imported the mess isolation was hired to contain — that is naive mode with an extra call and an extra bill.","So the contract is enforced, not hoped for: a bounded charter in, a bounded memo out, asserted before the memo is allowed into the parent. Break the assertion in the lab by returning the transcript instead of the memo, and watch the hand-back get refused."],"youDo":"In the U09 lab, return the full transcript from the sub-agent and confirm the budget assertion refuses it.","state":{"label":"sub-agent hand-back","before":{"title":"BEFORE — the transcript comes home","view":{"type":"diff","file":"agents/handback.py","lines":[["p","def isolated_subtask(charter, records):"],["p","    transcript = explore(charter, records)   # 40 reads, dead ends, re-reads"],["m","    return transcript                        # the archive room follows you home"]]}},"after":{"title":"AFTER — a memo, and only a memo","view":{"type":"diff","file":"agents/handback.py","lines":[["p","SUMMARY_BUDGET_TOKENS = 1500"],["p",""],["p","def isolated_subtask(charter, records):"],["p","    transcript = explore(charter, records)"],["a","    memo = condense(transcript, charter)"],["a","    assert len(memo) // 4 <= SUMMARY_BUDGET_TOKENS, 'hand-back over budget'"],["a","    return memo   # the exploration stays in the sub-agent's window"]]}}}}]},{"id":"uce-fabricated-dob","badge":"WALKTHROUGH","color":"#7A3E9D","time":"~5 min","title":"The fabricated birthdate","spec":"U10 · grounding, provenance, abstention","intro":"Ask for a fact that was deliberately removed from the data. The expensive mode invents it. The cheap one refuses. This is the module in one question.","provenance":{"kind":"measured","source":"bench/results/teaching-failures.json#Q7-naive"},"foot":"Do it for real: Compare drawer, Q7, <code>naive</code> vs <code>okf</code>","steps":[{"title":"A question with no answer in the data","narrative":["Q7 asks: <em>\"What is member M-2003's date of birth?\"</em> In the seeded dataset that field is <b>redacted</b> — it is PHI, deliberately minimised out of the record the assembler can see.","So there is exactly one correct response, and it is not a date. It is a refusal that says the field is redacted and does not guess."],"youDo":"Open the Members list and find M-2003. The DOB column shows a <b>redacted</b> badge rather than a value.","state":{"label":"member record · M-2003","before":{"title":"WHAT THE ASSEMBLER CAN SEE","view":{"type":"json","data":{"member_id":"M-2003","name":"Priya Raman","plan":"PPO-Gold","status":"ACTIVE","dob":"_redacted"},"highlight":["dob"]}}}},{"title":"Naive mode invents one","narrative":["Naive sends the whole domain — 1,612 tokens of it. Somewhere in that dump are dates: service dates, submission dates, review dates. None of them is a birthdate.","The model produces one anyway, with a name attached and a citation-shaped phrase — <em>\"according to the member record\"</em> — for a record that says <code>_redacted</code>. This is the failure mode that costs the most and looks the most confident."],"claudeSays":"Nothing in the prompt told it that not-knowing was an allowed outcome. Faced with a question and a pile of plausible material, it completed the pattern.","terminal":[{"kind":"prompt","text":"What is member M-2003's date of birth?"},{"kind":"tool","text":"assemble(mode=naive) → retrieved: 1,612 tokens, all records"},{"kind":"claude","text":"Member M-2003 (Priya Raman) was born on 1984-06-17 according to\nthe member record."},{"kind":"gate","text":"⏸  GRADING against the Q7 answer key"},{"kind":"out-fail","text":"✕ FAILED — forbidden pattern matched: 19[0-9]{2}-[0-9]{2}-[0-9]{2}\n         missing required: \"insufficient evidence\", \"redacted\""}],"source":"bench/results/teaching-failures.json#Q7-naive","state":{"label":"token receipt · Q7 · naive","before":{"title":"THE MOST EXPENSIVE ANSWER, AND IT IS INVENTED","view":{"type":"receipt","mode":"naive","question":"Q7 · M-2003's date of birth","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":9}],"inputTotal":1686,"output":28,"cost":"$0.00548","cacheRead":"0%","verdict":"failed","verdictNote":"fabricated a DOB · forbidden pattern hit"}}}},{"title":"The canonical file refuses","narrative":["OKF mode loads one curated concept file about member records. That file states the DOB field is PHI-minimised and unavailable — the absence is <b>written down</b> rather than merely being absent.","The model refuses, names the reason, and stops. <b>157 tokens</b>, and it is the only fully correct answer to this question in the entire ten-mode grid apart from the other selectors that share the same curated context."],"youDo":"Switch the toggle to <code>okf</code> and ask Q7 again. Read the answer, then read the receipt.","terminal":[{"kind":"prompt","text":"What is member M-2003's date of birth?"},{"kind":"tool","text":"assemble(mode=okf) → concept: member-record (83 tokens)"},{"kind":"claude","text":"Insufficient evidence: member M-2003's date of birth is redacted\n(PHI-minimized field). I cannot state or infer it."},{"kind":"out-pass","text":"✓ verified — refusal phrase present, no forbidden pattern"}],"source":"bench/results/replay-fullgrid.json#Q7-okf","state":{"label":"Q7 · naive vs okf","before":{"title":"BEFORE — 1,686 tokens, a fabricated date","view":{"type":"receipt","mode":"naive","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":9}],"inputTotal":1686,"verdict":"failed","verdictNote":"1984-06-17 — invented"}},"after":{"title":"AFTER — 157 tokens, a correct refusal","view":{"type":"receipt","mode":"okf","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":83},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":9}],"inputTotal":157,"output":28,"cost":"$0.00089","verdict":"verified","verdictNote":"refused, and said why"}}}},{"title":"Why more context made it worse","narrative":["The instinct when a model hallucinates is to give it more context. Q7 is the counterexample: naive had <b>ten times</b> the context of okf and used it to build a more convincing fabrication.","Volume is not grounding. What okf had was not more material but a <em>curated statement of what is unavailable</em> — the top rung of the grounding ladder, where absence is explicit and verifiable rather than merely unmentioned."],"source":"bench/results/replay-fullgrid.json#Q7","state":{"label":"Q7 · every mode","before":{"title":"MEASURED — the abstention question across the grid","view":{"type":"rows","columns":["mode","input tokens","answered","verdict"],"rows":[{"cells":["naive","1,686","invented 1984-06-17","✕ FAILED"],"tone":"bad"},{"cells":["okf","157","refused, cited redaction","✓ verified"],"tone":"win"},{"cells":["notes","157","refused, cited redaction","✓ verified"],"tone":"win"},{"cells":["jit","211","refused, cited redaction","✓ verified"]},{"cells":["compressed","206","refused, cited redaction","✓ verified"]},{"cells":["graph","320","refused, cited redaction","✓ verified"]}]}}}},{"title":"The gate, and what it costs you","narrative":["Two mechanisms produced that refusal, and you need both. The <b>confidence gate</b> makes abstention an available outcome — without it the model has no licence to return nothing. The <b>curated absence</b> gives it something true to say instead of a guess.","Be honest about the trade: a gate tuned too tight refuses questions it could have answered. That is why the capstone scorecard reports abstention-correct percentage <em>alongside</em> tokens, and never one without the other."],"youDo":"Break it deliberately: turn the confidence gate off in the U10 lab, re-ask Q7 in <code>okf</code> mode, and watch a curated context still produce a guess.","state":{"label":"the two mechanisms","before":{"title":"WHAT HAS TO BE TRUE TO REFUSE WELL","view":{"type":"rows","columns":["mechanism","what it does","without it"],"rows":[{"cells":["confidence gate","makes \"insufficient evidence\" a permitted answer","the model always answers something"]},{"cells":["curated absence","states the field is redacted, not merely omits it","silence reads as \"look harder\""]},{"cells":["forbidden-pattern check","grades a date-shaped answer as a failure","the fabrication ships unnoticed"]}]}}}}]},{"id":"uce-stale-instrument","badge":"WALKTHROUGH","color":"#2D7D8A","time":"~5 min","title":"The stale instrument","spec":"U11 · rot underneath the window, and the gate that catches it","intro":"Change one criterion weight in the seed while the app is running. Nothing errors, every stamp stays green, and every number you measure for the next hour is wrong. Then watch the gate name the damage in one line.","provenance":{"kind":"measured","source":"bench/seed/dataset.json"},"foot":"Do it for real: drill on a <b>copy</b> of <code>bench/seed/dataset.json</code>, never on the real one — <code>python bench/keys/generate_keys.py</code>","steps":[{"title":"One file, and everything downstream of it","narrative":["<code>bench/seed/dataset.json</code> is the walk-in cooler of this repo. Its own <code>_contract</code> field says so: <em>\"Single source of truth for MedFlow Copilot. The backend loads this into H2 at boot; bench/keys/generate_keys.py derives answer keys from it; module tables cite it.\"</em>","Count the derived artifacts. The H2 database the copilot queries. The answer keys the grader uses. The replay fixtures. The UI's standing-question mirrors. Every measured table in this course. None of them is \"valid until someone edits it\" — each is valid only until the seed changes."],"youDo":"Open <code>bench/seed/dataset.json</code> and find criterion <code>C-72148-2</code> under procedure 72148.","source":"bench/seed/dataset.json","state":{"label":"the source of truth","before":{"title":"MEASURED — one criterion, many dependants","view":{"type":"json","data":{"code":"72148","name":"MRI Lumbar Spine","tier":"diagnostics","criteria":[{"id":"C-72148-1","name":"Conservative therapy >= 6 weeks documented","weight":40},{"id":"C-72148-2","name":"Neurological deficit present","weight":35},{"id":"C-72148-3","name":"No MRI of same region in past 12 months","weight":25}]},"highlight":["criteria"]}}}},{"title":"Edit the seed. The app doesn't notice.","narrative":["Change <code>C-72148-2</code>'s weight from 35 to 30 and save. This is a legitimate policy edit — clinical criteria get reweighted — and it is exactly the kind of change that ships silently.","Read <code>SeedLoader.java</code> to see why nothing happens: the loader is annotated <code>@PostConstruct</code>. It reads the seed <b>once, at boot</b>, writes it into H2, and keeps the parsed object as \"the in-memory authority for the ContextAssembler, grading, and policy endpoints\". A running backend has no idea the file on disk moved underneath it."],"claudeSays":"There is no file watcher and no reload endpoint. That is a deliberate design — but it means an edited seed and a running app are two different truths until you restart.","source":"bench/seed/dataset.json","state":{"label":"bench/seed/dataset.json","before":{"title":"BEFORE — the seed the running app loaded at boot","view":{"type":"diff","file":"bench/seed/dataset.json","lines":[["p","        {"],["p","          \"id\": \"C-72148-2\","],["p","          \"name\": \"Neurological deficit present\","],["p","          \"weight\": 35"],["p","        },"]]}},"after":{"title":"AFTER — the seed on disk, one save later","view":{"type":"diff","file":"bench/seed/dataset.json","lines":[["p","        {"],["p","          \"id\": \"C-72148-2\","],["p","          \"name\": \"Neurological deficit present\","],["m","          \"weight\": 35"],["a","          \"weight\": 30"],["p","        },"]]}}}},{"title":"Ask Q1. Everything is green and nothing is true.","narrative":["Ask the copilot Q1 — <em>\"Which criteria apply to procedure 72148 and what is the weight of each?\"</em> — and it answers <b>40 / 35 / 25</b>, because that is what H2 holds and the assembler reads. The grader checks it against Q1's key facts, which still list <code>35</code>, and stamps ✓ PASS.","Two instruments, both green, both reading yesterday's cream. This is the signature of altitude-two rot: <em>nothing crashes</em>. Any campaign you run in this state is measuring a stale instrument, and the receipts will look immaculate."],"youDo":"Ask Q1 in any mode without restarting the backend, and read the answer against the file you just saved.","terminal":[{"kind":"prompt","text":"Which criteria apply to procedure 72148 and what is the weight of each?"},{"kind":"tool","text":"assemble(mode=okf) → SeedLoader.seed() : in-memory copy, loaded at boot"},{"kind":"claude","text":"Procedure 72148 (MRI Lumbar Spine) has 3 criteria: Conservative therapy\n>= 6 weeks documented (weight 40); Neurological deficit present (weight 35);\nNo MRI of same region in past 12 months (weight 25)."},{"kind":"out-pass","text":"✓ verified — key facts present: Conservative therapy, 40, Neurological deficit, 35, No MRI of same region, 25"},{"kind":"gate","text":"⏸  and the file on disk says 30"}],"source":"bench/seed/dataset.json","state":{"label":"two truths, no error","before":{"title":"MEASURED — where each instrument is reading from","view":{"type":"rows","columns":["reader","source","weight for C-72148-2","state"],"rows":[{"cells":["<code>dataset.json</code> on disk","the file you just saved","30","current"],"tone":"win"},{"cells":["running backend (H2 + SeedData)","boot-time copy","35","<b>stale</b>"],"tone":"bad"},{"cells":["answer keys (<code>key_facts</code>)","derived, not regenerated","35","<b>stale</b>"],"tone":"bad"},{"cells":["replay fixtures &amp; course tables","derived, not regenerated","35","<b>stale</b>"],"tone":"bad"}]}}}},{"title":"The gate names the blast radius","narrative":["The defence is mechanical and this repo ships it. <code>bench/keys/generate_keys.py</code> recomputes every determination from the seed's own scoring rule and compares it to the stored expectation. It is not checking that a job ran; it is checking a content-derived fact.","Run it against the tampered seed and it refuses with exit 1, naming <b>exactly PA-1001</b> — the only request whose determination the reweight actually changed, since PA-1001 is the one that met all three criteria (40+30+25 = 95, not 100). That one-line list <em>is</em> your blast radius: not \"something changed somewhere\", but which derived facts are now invalid."],"youDo":"Run <code>python bench/keys/generate_keys.py</code> and read the exit code, not just the text.","terminal":[{"kind":"prompt","text":"python bench/keys/generate_keys.py"},{"kind":"out-fail","text":"CONTRACT BROKEN:\n  PA-1001: computed (95,APPROVED) != expected (100,APPROVED)"},{"kind":"prompt","text":"echo $?"},{"kind":"out","text":"1"}],"source":"bench/seed/dataset.json","state":{"label":"detection within a day, in under a second","before":{"title":"MEASURED — the reweight, traced through the scoring rule","view":{"type":"rows","columns":["request","criteria met","score before","score after","gate"],"rows":[{"cells":["PA-1001","C-1, C-2, C-3","100 → APPROVED","<b>95</b> → APPROVED","✕ CONTRACT BROKEN"],"tone":"bad"},{"cells":["PA-1002","C-1, C-3","65 → MANUAL_REVIEW","65 → MANUAL_REVIEW","unaffected"]},{"cells":["PA-1003","C-3","25 → DENIED","25 → DENIED","unaffected"]},{"cells":["PA-1009","eligibility: LAPSED","0 → DENIED","0 → DENIED","unaffected"]}]}}}},{"title":"Put the gate in front of the copilot","narrative":["Detection you have to remember to run is not a control. The U11 lab wires the same check ahead of the app: compare the seed's content hash and mtime against what the running backend loaded, and refuse to serve the copilot while they disagree.","The banner has to be <em>actionable</em>, which means it names the file, the drift, and the exact command that resolves it. A gate that says \"data may be stale\" trains people to click through it; a gate that says \"restart the backend, then rerun generate_keys.py\" gets obeyed."],"youDo":"Add the freshness check to the copilot's request path in the U11 lab, then edit the seed again and confirm it blocks.","terminal":[{"kind":"prompt","text":"Which criteria apply to procedure 72148 and what is the weight of each?"},{"kind":"gate","text":"⏸  FRESHNESS GATE — seed changed since boot"},{"kind":"out-fail","text":"✕ blocked: bench/seed/dataset.json modified after SeedLoader.load()\n         loaded sha256 4f2c…a119 · on-disk sha256 0b7e…33d5\n         fix: restart the backend, then `python bench/keys/generate_keys.py`"}],"state":{"label":"the banner the copilot shows","before":{"title":"AN ACTIONABLE REFUSAL, NOT A WARNING","view":{"type":"note","text":"<b>Answers disabled — the instrument is stale.</b> The seed this backend loaded at boot no longer matches <code>bench/seed/dataset.json</code>. Every answer, receipt and verdict produced from here would grade today's data against yesterday's truth. Restart the backend, rerun <code>generate_keys.py</code>, and regenerate fixtures before measuring anything."}}}},{"title":"Restart, restore, and watch agreement come back","narrative":["Restart the backend and the app finally reads what you wrote: Q1 now answers <b>weight 30</b>. And now the grader fails it — Q1's key facts still demand <code>35</code>. That FAIL is not a regression; it is the second derived artifact finally admitting it was stale too. The restock protocol is: regenerate the keys, regenerate the fixtures, re-measure the tables, in that order.","Restore the original weight (this was a drill — you drilled on a copy) and the gate returns to <code>contract consistent (10 determinations verified); 10 keys -&gt; keys.json</code>, with both instruments back in agreement.","The law underneath the whole exercise: <b>a derived fact inherits the shortest shelf life of what it depends on.</b> If you cannot say, mechanically, how you would detect staleness within 24 hours, you do not have a system — you have a demo that has not failed yet."],"terminal":[{"kind":"prompt","text":"./mvnw spring-boot:run   # restart — SeedLoader re-reads the seed"},{"kind":"out","text":"SeedLoader: loaded bench/seed/dataset.json (6 members, 10 requests, 3 procedures)"},{"kind":"prompt","text":"Which criteria apply to procedure 72148 and what is the weight of each?"},{"kind":"claude","text":"…Neurological deficit present (weight 30)…"},{"kind":"out-fail","text":"✕ FAILED — missing required fact: 35   (the answer key is stale, not the app)"},{"kind":"prompt","text":"git checkout bench/seed/dataset.json && python bench/keys/generate_keys.py"},{"kind":"out-pass","text":"contract consistent (10 determinations verified); 10 keys -> keys.json"}],"source":"bench/seed/dataset.json","state":{"label":"the restock protocol","before":{"title":"EVERY DERIVED ARTIFACT, AND WHAT REFRESHES IT","view":{"type":"rows","columns":["derived artifact","derived from","refresh action"],"rows":[{"cells":["H2 database + in-memory <code>SeedData</code>","dataset.json at boot","restart the backend"]},{"cells":["<code>bench/keys/keys.json</code>","standing_questions + scoring rule","<code>python bench/keys/generate_keys.py</code>"]},{"cells":["replay fixtures","seed records","re-record, then re-grade"]},{"cells":["UI standing-question mirrors","seed, hand-copied","regenerate — never hand-edit a derived file"]},{"cells":["every measured table in this course","the graded grid","re-run the campaign, relabel the source"]}]}}}}]},{"id":"uce-router","badge":"WALKTHROUGH","color":"#8A6D2F","time":"~6 min","title":"Reading the router off your own grid","spec":"U12 · cheapest arm that passes, per question class","intro":"Build the routing table the way a triage desk is built: class by class, cheapest arm that passes the answer key — never the cheapest arm. Then read the shipped router's real row, including the two cells where it pays 1,800 tokens.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json"},"foot":"Do it for real: ask all ten presets in <code>routed</code> mode and read the delegate each receipt names.","steps":[{"title":"The rule, before any numbers","narrative":["A hospital's triage desk does not send every patient to the cheapest department, and a unit currently failing its safety audit takes no patients at all — however short its queue. The router obeys the same two-part rule: <b>among the arms that pass the answer key on this question class, take the cheapest one.</b>","Both halves matter, and the order matters. Correctness is the filter; price is the sort. Reverse them and you have built a machine for shipping cheap
