wrong answers at scale."],"youDo":"Before looking at any token number, list which arms passed every question in the class you are routing.","state":{"label":"the routing contract","before":{"title":"TWO STEPS, IN THIS ORDER","view":{"type":"rows","columns":["step","input","output"],"rows":[{"cells":["1 · filter","per-class verdicts from the graded grid","the eligible set — 100% correct on that class"]},{"cells":["2 · sort","input tokens of the eligible arms only","the delegate for that class"]},{"cells":["<b>never</b>","grid-wide medians or averages","<b>an average hides the class it fails</b>"],"tone":"bad"}]}}}},{"title":"Canonical and abstention: the easy classes","narrative":["<b>Canonical</b> questions (Q3 thresholds, Q4 eligibility rule) ask the system to recite policy. Every arm passes, so this is a pure price sort — and <code>okf</code> wins at <b>186 tokens on both</b>, because a curated concept file about policy is smaller than any retrieval over the domain. The instructive loser is <code>graph</code>: 840 and 1,054 tokens, five times okf's price, because traversing a relationship graph to reach a constant is work that a constant does not need.","<b>Abstention</b> (Q7 a redacted DOB, Q8 a note that does not exist) is where the filter first bites. <code>naive</code> is the cheapest-looking large arm at 1,686 on Q7 — and it <b>FAILED</b>, fabricating a birthdate. It is out of the eligible set at any price. Among the rest, <code>okf</code> at 157/152 and <code>notes</code> at 157/135 are within a few tokens of each other."],"source":"bench/results/replay-fullgrid.json#Q3,bench/results/replay-fullgrid.json#Q4,bench/results/replay-fullgrid.json#Q7,bench/results/replay-fullgrid.json#Q8","state":{"label":"measured — two classes, eligible arms only","before":{"title":"MEASURED — canonical (Q3 · Q4)","view":{"type":"rows","columns":["arm","Q3","Q4","verdicts","eligible?"],"rows":[{"cells":["okf","<b>186</b>","<b>186</b>","✓ ✓","yes — cheapest"],"tone":"win"},{"cells":["notes","231","143","✓ ✓","yes"]},{"cells":["compressed","234","175","✓ ✓","yes"]},{"cells":["jit","285","145","✓ ✓","yes"]},{"cells":["graph","840","1,054","✓ ✓","yes, and wildly overpriced here"],"tone":"bad"},{"cells":["naive","1,696","1,696","✓ ✓","yes, but why"]}]}},"after":{"title":"MEASURED — abstention (Q7 · Q8)","view":{"type":"rows","columns":["arm","Q7","Q8","verdicts","eligible?"],"rows":[{"cells":["notes","157","<b>135</b>","✓ ✓","yes"],"tone":"win"},{"cells":["okf","157","152","✓ ✓","yes"],"tone":"win"},{"cells":["jit","211","188","✓ ✓","yes"]},{"cells":["compressed","206","193","✓ ✓","yes"]},{"cells":["naive","1,686","1,688","<b>✕ ✓</b>","<b>no — fabricated a DOB on Q7</b>"],"tone":"bad"}]}}}},{"title":"Aggregation: the cheap arm is disqualified","narrative":["Q9 asks for M-2001's authorization history. <code>compressed</code> answers it for <b>208 tokens</b> — the cheapest number in the class — and its abstract dropped <code>PA-1004</code> and <code>MANUAL_REVIEW</code>, replacing them with <em>\"her history shows consistent approvals\"</em>. Graded: <b>✕ FAILED</b>.","So compressed is ineligible for aggregation. Not deprioritised, not penalised — <b>ineligible</b>, at any price, until it is fixed and re-measured. That is the whole rule doing its work: a saving that changes the answer is a discount on a defect. In a prior-authorization system, \"consistent approvals\" about a member with a pending manual review is not a rounding error; it is the wrong clinical picture."],"youDo":"Open the Compare drawer on Q9 with <code>compressed</code> in one column, and read the missing-facts list under the verdict.","source":"bench/results/teaching-failures.json#Q9-compressed,bench/results/replay-fullgrid.json#Q9,bench/results/replay-fullgrid.json#Q10","state":{"label":"measured — aggregation (Q9 · Q10)","before":{"title":"MEASURED — who is still on the board after grading","view":{"type":"rows","columns":["arm","Q9","Q10","verdicts","eligible for aggregation?"],"rows":[{"cells":["compressed","<b>208</b>","237","<b>✕ ✓</b>","<b>no — dropped PA-1004, MANUAL_REVIEW</b>"],"tone":"bad"},{"cells":["notes","167","262","✓ ✓","yes"],"tone":"win"},{"cells":["okf","190","184","✓ ✓","yes"],"tone":"win"},{"cells":["jit","220","316","✓ ✓","yes"]},{"cells":["graph","286","500","✓ ✓","yes"]},{"cells":["budgeted","565","559","✓ ✓","yes"]},{"cells":["naive","1,700","1,694","✓ ✓","yes"]},{"cells":["isolated","1,796","1,802","✓ ✓","yes — and the priciest arm on the grid"]}]}}}},{"title":"The table that actually ships","narrative":["The router in this repo is not a heuristic hidden in a prompt — it is a five-line switch you can read. <code>ContextAssembler.route()</code> classifies the question, then maps the class to a delegate; the receipt header names that delegate (<code>ROUTED:OKF</code>, <code>ROUTED:ISOLATED</code>) so every routed answer is traceable to a decision you can argue with.","Notice what kind of table this is. It maps each class to the arm whose <em>design</em> matches the class shape: a graph for structure, a canonical file for policy recital, a compressor for reasoning chains, a sub-agent for gather-everything aggregation. That is a defensible way to build a first table. It is also a claim — and the grid is where claims get priced."],"source":"app/api/src/main/java/com/medflow/copilot/context/ContextAssembler.java","state":{"label":"app/api/.../context/ContextAssembler.java","before":{"title":"MEASURED — the shipped routing table, verbatim","view":{"type":"diff","file":"app/api/src/main/java/com/medflow/copilot/context/ContextAssembler.java","lines":[["p","public Mode route(String q) {"],["p","    return switch (classify(q)) {"],["p","        case \"structural\"  -> Mode.GRAPH;"],["p","        case \"canonical\"   -> Mode.OKF;"],["p","        case \"abstention\"  -> Mode.OKF;"],["p","        case \"aggregation\" -> Mode.ISOLATED;"],["p","        default            -> Mode.COMPRESSED;  // logic"],["p","    };"],["p","}"]]}}}},{"title":"Price the shipped table against the derivation","narrative":["Now put the two tables side by side: the shipped shape-matched one, and the one you get by mechanically taking the cheapest arm that passes each class. They agree on canonical and land within a few tokens on abstention. They diverge on the other three.","The biggest gap is aggregation: <b>isolated at 1,796/1,802 where okf passed both at 190/184</b> — about 1,600 tokens per question. Some of that gap is the honest price of caution: aggregation is the one class where a cheap arm was caught dropping a load-bearing fact, and a sub-agent that gathers in a clean window is a structurally safer default for questions beyond these ten. But caution is a choice with a bill, and the discipline is to publish the bill rather than describe the choice as optimal.","The rule survives either way: <em>both</em> tables route aggregation away from compressed. Where they differ is only in how much margin you buy above the eligibility line."],"source":"bench/results/replay-fullgrid.json","state":{"label":"shipped delegate vs cheapest eligible","before":{"title":"MEASURED — the delta, class by class","view":{"type":"rows","columns":["class","shipped delegate","its cells","cheapest eligible","its cells"],"rows":[{"cells":["canonical","okf","186 · 186","okf","186 · 186"],"tone":"win"},{"cells":["abstention","okf","157 · 152","notes","157 · 135"]},{"cells":["structural","graph","450 · 437","notes","141 · 232"]},{"cells":["logic","compressed","247 · 231","okf","194 · 183"]},{"cells":["aggregation","isolated","<b>1,796 · 1,802</b>","okf","<b>190 · 184</b>"],"tone":"bad"}]}}}},{"title":"Routed's real row — medians and totals disagree","narrative":["Here is the shipped router's actual grid row, ten cells, no editing: <b>450 · 437 · 186 · 186 · 247 · 231 · 157 · 152 · 1,796 · 1,802</b>, all ten ✓ PASS. The median is <b>239 tokens against naive's 1,696</b> — a <b>7.1x</b> saving at 100% correctness, and the headline the course quotes.","Now the number that headline hides. Summed across the ten-question session, routed spends <b>5,644 tokens against naive's 16,948</b> — <b>3.0x</b>, not 7.1x. The two aggregation cells are 64% of the router's entire session bill. A median is a fine summary of a typical question and a poor summary of a session, and the honest scorecard reports both.","Last: the routing table is itself a derived fact, so U11's law applies to it. Re-measure the grid — new seed, new mode implementation, new model — and re-derive the table, or the router keeps optimising for a world that no longer exists."],"youDo":"Ask all ten presets in <code>routed</code> mode and add up the session strip; compare the total to the median you were quoted.","source":"bench/results/replay-fullgrid.json","state":{"label":"routed · all ten cells","before":{"title":"MEASURED — the router's row","view":{"type":"rows","columns":["question","class","delegate","tokens","verdict"],"rows":[{"cells":["Q1","structural","graph","450","✓ PASS"]},{"cells":["Q2","structural","graph","437","✓ PASS"]},{"cells":["Q3","canonical","okf","186","✓ PASS"],"tone":"win"},{"cells":["Q4","canonical","okf","186","✓ PASS"],"tone":"win"},{"cells":["Q5","logic","compressed","247","✓ PASS"]},{"cells":["Q6","logic","compressed","231","✓ PASS"]},{"cells":["Q7","abstention","okf","157","✓ PASS"],"tone":"win"},{"cells":["Q8","abstention","okf","152","✓ PASS"],"tone":"win"},{"cells":["Q9","aggregation","isolated","<b>1,796</b>","✓ PASS"],"tone":"bad"},{"cells":["Q10","aggregation","isolated","<b>1,802</b>","✓ PASS"],"tone":"bad"}]}},"after":{"title":"MEASURED — two summaries of the same row","view":{"type":"rows","columns":["summary","routed","naive","ratio"],"rows":[{"cells":["median over correct answers","239","1,696","<b>7.1x</b>"],"tone":"win"},{"cells":["sum across the ten-question session","5,644","16,948","<b>3.0x</b>"]},{"cells":["correctness","10/10","9/10 (Q7 fabricated)","the only column that gates the others"]}]}}}}]},{"id":"uce-two-instruments","badge":"WALKTHROUGH","color":"#6366F1","time":"~6 min","title":"Two scales, one dose","spec":"U13 · reconciling the Token Lens with the bench harness","intro":"A drifting scale looks exactly like a working one. Weigh every call twice — the app's own receipt and the external harness — assert they agree, then use the same discipline to read a published 71.5x claim.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json"},"foot":"Do it for real: <code>python bench/run_campaign.py --modes naive,okf --questions Q3 --replay</code> and compare against the Token Lens.","steps":[{"title":"The pharmacy weighs it twice","narrative":["A compounding pharmacy weighs every dose on two different scales. Not because either is bad — because a scale that has drifted produces confident, plausible, wrong numbers, and disagreement is the cheapest detector that exists.","This repo ships two independent instruments over the same calls. The <b>Token Lens</b> is the app's own receipt: layer-by-layer accounting rendered next to the answer, plus a server-side correctness verdict. The <b>harness</b> is <code>bench/run_campaign.py</code>, which POSTs to <code>/api/copilot/ask</code>, grades the answer itself through <code>bench/verify.py</code>, and writes its own row. Neither reads the other's conclusion."],"youDo":"Run one cell through the harness while watching the same question in the app.","terminal":[{"kind":"prompt","text":"python bench/run_campaign.py --modes naive,okf --questions Q3 --replay"},{"kind":"out","text":" Q3 naive      r0   1,696 tok  PASS \n Q3 okf        r0     186 tok  PASS "},{"kind":"out","text":"\nmode         graded correct%  median tok (correct only)\n--------------------------------------------------------\nnaive             1     100%                      1,696\nokf               1     100%                        186"},{"kind":"out-pass","text":"wrote bench/results/campaign-naive-okf.json  ·  no grading mismatches"}],"source":"bench/run_campaign.py"},{"title":"Assertion one — the layers must sum to the total","narrative":["The first reconciliation is arithmetic, and it is the one that catches a broken seam fastest. Every receipt reports five layers and an input total; the total must equal the sum of the layers, for every cell, with no slack.","Take Q3 in <code>okf</code>: 65 + 102 + 0 + 0 + 19 = <b>186</b>, which is exactly the input total the harness recorded. Run that check across all 100 cells of the shipped grid and the drift count is <b>zero</b>. This is the assertion that would have caught the response-shape seam failure this course hit during its own build — a harness reading a wrapper key that wasn't there, recording 100 cells of zeros, and only being noticed because a 0-token PASS is arithmetically impossible."],"source":"bench/results/replay-fullgrid.json#Q3-okf","state":{"label":"reconciliation · Q3 · okf","before":{"title":"MEASURED — layers, and the total they must produce","view":{"type":"receipt","mode":"okf","question":"Q3 · score thresholds for approval / review / denial","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":102},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":19}],"inputTotal":186,"output":30,"cost":"$0.001008","cacheRead":"0%","verdict":"verified","verdictNote":"65 + 102 + 0 + 0 + 19 = 186 · 100/100 cells reconcile"}}}},{"title":"Assertion two — two graders, one verdict","narrative":["The second reconciliation is about judgement, not arithmetic. Every row carries <code>verdict</code> (the harness graded the answer text against the key) and <code>backend_verdict</code> (the server graded it independently). They must match on every cell. On the shipped grid, <b>100 cells, zero disagreements</b> — and the runner prints a loud WARNING the moment that stops being true.","An instrument you trust because it has never complained is not an instrument. So prove the grader can fail before you believe it passing: <code>bench/verify_selftest.py</code> feeds it three planted wrong answers — a wrong threshold, a fabricated date of birth, a denial with the wrong reason — and the selftest only passes if the grader catches all three.","The rule when the two disagree is uncomfortable and non-negotiable: you stop trusting <b>both</b> until you know why. One of them is wrong and you do not yet know which."],"youDo":"Run <code>python bench/verify_selftest.py</code> first, every time — a grader that cannot fail cannot grade.","terminal":[{"kind":"prompt","text":"python bench/verify_selftest.py"},{"kind":"out","text":"[PASS] Q3 expected FAIL: wrong threshold (missing 80/50, forbidden 70) missing=['80', '50'] forbidden=['70']"},{"kind":"out","text":"[PASS] Q7 expected FAIL: fabricated DOB must trip the forbidden regex missing=['insufficient evidence', 'redacted'] forbidden=['19[0-9]{2}-[0-9]{2}-[0-9]{2}']"},{"kind":"out-pass","text":"SELFTEST PASSED — the grader catches wrong answers and fabrications"},{"kind":"prompt","text":"python reconcile.py bench/results/replay-fullgrid.json"},{"kind":"out-pass","text":"100 cells; 0 layer-sum drifts; 0 instrument disagreements"}],"source":"bench/verify_selftest.py,bench/results/replay-fullgrid.json","state":{"label":"what each instrument checks","before":{"title":"MEASURED — the reconciliation surface","view":{"type":"rows","columns":["check","instrument 1","instrument 2","shipped grid"],"rows":[{"cells":["input accounting","Token Lens layer sums","harness <code>tokens_in</code>","100/100 agree"],"tone":"win"},{"cells":["correctness","backend <code>correctness.verdict</code>","<code>verify.grade()</code>","100/100 agree"],"tone":"win"},{"cells":["can the grader fail?","—","<code>verify_selftest.py</code>","3/3 planted failures caught"],"tone":"win"},{"cells":["when they disagree","suspect","suspect","<b>trust neither until explained</b>"],"tone":"bad"}]}}}},{"title":"The canary that has no fallback","narrative":["Reconciliation catches instruments that disagree. It does not catch instruments that agree and are both wrong — which is what happens when the infrastructure underneath a whole arm fails politely.","The knowledge-graph course paid for this twice: two complete campaigns measured a \"graph arm\" whose MCP server had been silently crashing. File-tool fallbacks made the failure invisible; the arm kept answering, the numbers looked plausible, and the conclusion (\"the graph doesn't help much\") was confidently wrong. The rule that came out of it: <b>always run one arm with no fallback</b>.","In MedFlow that arm is <code>okf</code>. It answers only from canonical concept files. Break the concept store and okf fails loudly on the next question instead of quietly degrading into naive behaviour — which is precisely why it is also the arm whose numbers you can trust most."],"state":{"label":"silent degradation vs the canary","before":{"title":"BEFORE — every arm has a fallback","view":{"type":"note","text":"The concept store is down. The arm falls back to reading the domain dump, answers correctly, and posts a token number that describes a completely different mechanism. Two campaigns later, someone writes \"curated context provides only marginal benefit\" in a report."}},"after":{"title":"AFTER — one arm refuses to improvise","view":{"type":"note","text":"<code>okf</code> has no fallback path. The concept store is down, so the arm errors on question one, the campaign stops, and you fix an infrastructure bug instead of publishing a finding about it. A canary is not redundancy — it is deliberately removed redundancy."}}}},{"title":"The anatomy of 71.5x","narrative":["Now apply the same scepticism to a published number. The famous <b>71.5x token reduction</b> for structural code context is real — as a <em>ceiling case</em>: one favourable corpus, one favourable query shape, and a baseline that dumped whole files. Independent replications of the same tool class land between <b>6.8x and 49x</b>, and on some stacks it loses outright.","Nothing was faked. What happened is a <b>quantity-class swap</b>: a mechanical floor, or someone else's session, quoted as though it were a prediction about your stack. All three are correct answers to different questions, and only the third is a forecast.","So place your own numbers in their class before you compare anything. This bench's <code>okf</code> arm reaches <b>9.1x</b> over naive on medians and <b>7.1x</b> for the router — respectable numbers that would look feeble next to 71.5x and are not on the same axis as it, because these are graded against an answer key and that one was not."],"source":"bench/results/replay-fullgrid.json","state":{"label":"the three quantities","before":{"title":"WHICH NUMBER IS WHICH","view":{"type":"rows","columns":["quantity","what it answers","example","is it a forecast for you?"],"rows":[{"cells":["mechanical floor","worst-case arithmetic, no model in the loop","\"a graph is 71.5x smaller than the files it indexes\"","no"]},{"cells":["other people's sessions","real work, their stack, their questions","replications at 6.8x–49x","only as a range"]},{"cells":["your stack, live","what your users would actually pay","your own recorded campaign","yes"],"tone":"win"},{"cells":["<b>this grid</b>","deterministic replay of your stack, graded","okf <b>9.1x</b> · routed <b>7.1x</b> medians","close — but labelled <code>synthetic-pre-recording</code>"],"tone":"bad"}]}}}},{"title":"Publish the conditions with the number","narrative":["The last discipline is the cheapest and the most often skipped: every headline number travels with the conditions that produced it. Ten questions. One corpus. Deterministic replay, so repetitions would be theatre — the median-of-three rule becomes mandatory the moment you record live, because identical fresh sessions have been measured varying by 2x.","And report the summary that matches the claim. \"7.1x\" is a median over single questions; across the full ten-question session the router spends 5,644 tokens against naive's 16,948, which is <b>3.0x</b>. Both are true, neither is the other, and a scorecard that prints only the flattering one has quietly become the thing this module is about."],"youDo":"Take any number you are about to publish and write its four conditions next to it: corpus, question mix, baseline, and source label.","source":"bench/results/replay-fullgrid.json","state":{"label":"this bench's own claims, fully labelled","before":{"title":"MEASURED — every claim with its conditions","view":{"type":"rows","columns":["claim","summary type","conditions","source label"],"rows":[{"cells":["okf 9.1x over naive","median over 10 correct answers","10 questions, MedFlow seed, graded against key facts","<code>synthetic-pre-recording</code>"]},{"cells":["routed 7.1x over naive","median over 10 correct answers","same, router = shipped table","<code>synthetic-pre-recording</code>"]},{"cells":["routed 3.0x over naive","sum across the whole session","same cells, different summary","<code>synthetic-pre-recording</code>"]},{"cells":["isolated costs <b>more</b> than naive","median 1,805 vs 1,696","single-shot questions — isolation's worst shape","<code>synthetic-pre-recording</code>"],"tone":"bad"},{"cells":["2 graded failures disclosed","naive×Q7, compressed×Q9","both caught by the grader, both on the board","<code>synthetic-teaching-failure</code>"],"tone":"win"}]}}}}]},{"id":"uce-scorecard","badge":"WALKTHROUGH","color":"#0F766E","time":"~6 min","title":"The scorecard you can defend","spec":"U14 · the capstone run, read the way a professional reads it","intro":"Gates, then a hundred graded cells, then one page of numbers that each survive the question \"how do you know?\" — including the two that are failures and stay on the card.","provenance":{"kind":"measured","source":"bench/results/replay-fullgrid.json"},"foot":"Do it for real: fresh clone → seed gate → grader selftest → app tests → full campaign → reconcile → route.","steps":[{"title":"Gates before trust","narrative":["The capstone is a protocol, not a number. Each step is gated by the one before it, and the order is the point: verify the source of truth, then prove the grader can fail, then prove the app agrees with both — <em>and only then</em> measure anything.","Skipping a gate because \"nothing changed\" is the failure mode this whole course has been about. The seed contract takes under a second to verify; the campaign that follows it takes a hundred graded calls. Cheap check first, always."],"youDo":"Run the three gates on a fresh clone before you record a single token.","terminal":[{"kind":"prompt","text":"python bench/keys/generate_keys.py"},{"kind":"out-pass","text":"contract consistent (10 determinations verified); 10 keys -> keys.json"},{"kind":"prompt","text":"python bench/verify_selftest.py"},{"kind":"out-pass","text":"SELFTEST PASSED — the grader catches wrong answers and fabrications"},{"kind":"prompt","text":"cd app/api && ./mvnw test"},{"kind":"out-pass","text":"BUILD SUCCESS — golden determinations, per-mode reconciliation, abstention, fidelity"},{"kind":"gate","text":"⏸  three gates green — the instrument is now allowed to measure"}],"source":"bench/verify_selftest.py","state":{"label":"the protocol","before":{"title":"SIX STEPS, EACH GATED BY THE LAST","view":{"type":"rows","columns":["#","step","command","gate condition"],"rows":[{"cells":["1","contract","<code>bench/keys/generate_keys.py</code>","10 determinations verified"]},{"cells":["2","grader","<code>bench/verify_selftest.py</code>","catches all planted failures"]},{"cells":["3","app","<code>./mvnw test</code>","golden determinations green"]},{"cells":["4","campaign","<code>bench/run_campaign.py --replay</code>","100 cells, no errors"]},{"cells":["5","reconcile","your U13 reconciler","0 layer drift, 0 disagreements"]},{"cells":["6","route","your U12 derivation","re-derived from <b>this</b> run's grid"]}]}}}},{"title":"A hundred graded cells","narrative":["Ten questions across five classes — structural, canonical, logic, abstention, aggregation — times ten modes. Every cell is one POST to <code>/api/copilot/ask</code>, graded against the answer key by key-fact substrings and forbidden regexes. No cell is exempt and no cell is dropped for looking bad.","Replay mode is deterministic, so repetitions are theatre here; the moment you record live, medians-of-three become mandatory and every row's <code>source</code> label changes with it."],"youDo":"Run the campaign across all ten modes and let it finish — including the arms you expect to lose.","terminal":[{"kind":"prompt","text":"python bench/run_campaign.py --modes naive,budgeted,compressed,cached,jit,graph,okf,notes,isolated,routed --replay"},{"kind":"out","text":" Q7 naive      r0   1,686 tok  FAIL (SAVINGS VOID)"},{"kind":"out","text":" Q9 compressed r0     208 tok  FAIL (SAVINGS VOID)"},{"kind":"out","text":" Q9 routed     r0   1,796 tok  PASS "},{"kind":"out-pass","text":"100 cells graded · no backend/harness grading mismatches"}],"source":"bench/run_campaign.py"},{"title":"Line 1 and Line 2 — tokens, at correctness","narrative":["Here is the whole grid as one table, and it has two columns because a token number without a verdict is a menu without allergen labels. Read the correctness column first, every time.","<code>okf</code> holds a <b>186-token median at 10/10</b> — 9.1x under naive. <code>notes</code> is close behind at 197.5. <code>compressed</code> posts a tempting 231 median and <b>9/10</b>, which disqualifies it from the class it failed. And <code>naive</code>, the control, is not merely expensive at 1,696 — it is the only arm that fabricated an answer.","The line that does not fit the marketing story stays on the card: <code>isolated</code> costs <b>1,805 median, more than naive's 1,696</b>, at a perfect 10/10. That is isolation priced on single-shot questions, which is its worst shape. Labelled, not hidden."],"source":"bench/results/replay-fullgrid.json","state":{"label":"the mastery scorecard · all ten arms","before":{"title":"MEASURED — correct count first, median second","view":{"type":"rows","columns":["mode","correct","median tokens (correct only)","vs naive","note"],"rows":[{"cells":["okf","10/10","<b>186</b>","9.1x","cheapest arm at full correctness"],"tone":"win"},{"cells":["notes","10/10","197.5","8.6x","facts kept outside the window"],"tone":"win"},{"cells":["routed","10/10","239","7.1x","the shipped router"],"tone":"win"},{"cells":["jit","10/10","251","6.8x","fetch-on-demand"]},{"cells":["compressed","<b>9/10</b>","231","—","<b>savings void on Q9</b>"],"tone":"bad"},{"cells":["graph","10/10","443.5","3.8x","overpriced on canonical questions"]},{"cells":["budgeted","10/10","560","3.0x","evicts records to a cap"]},{"cells":["cached","10/10","731","2.3x","prefix stability, not size"]},{"cells":["naive","<b>9/10</b>","1,696","1.0x","<b>the control — and it fabricated</b>"],"tone":"bad"},{"cells":["isolated","10/10","1,805","0.94x","correct, and dearer than the control"],"tone":"bad"}]}}}},{"title":"The two failures stay on the card","narrative":["Two of the hundred cells failed, and a scorecard that omitted them would be worth nothing. Both were caught mechanically, neither by reading the answers and feeling uneasy.","<b>naive × Q7</b>: asked for member M-2003's date of birth — a field the seed marks <code>_redacted</code> — and it produced <em>\"born on 1984-06-17 according to the member record\"</em>. Graded by shape: the forbidden regex <code>19[0-9]{2}-[0-9]{2}-[0-9]{2}</code> matched, and the required phrases <em>insufficient evidence</em> and <em>redacted</em> were absent. <b>1,686 tokens</b> — the most context, the most confident, the least true.","<b>compressed × Q9</b>: summarised M-2001's history into <em>\"PA-1001 was APPROVED. Her history shows consistent approvals\"</em>, dropping <code>PA-1004</code> and <code>MANUAL_REVIEW</code>. <b>208 tokens</b>, an 88% saving, voided. The two failures are different diseases — one added a fact that did not exist, one removed one that did — and the same grader caught both."],"source":"bench/results/teaching-failures.json#Q7-naive,bench/results/teaching-failures.json#Q9-compressed","state":{"label":"disclosed failures · 2 of 100 cells","before":{"title":"MEASURED — naive × Q7, a fabrication","view":{"type":"receipt","mode":"naive","question":"Q7 · M-2003's date of birth","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":1612},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":9}],"inputTotal":1686,"output":28,"cost":"$0.005478","cacheRead":"0%","verdict":"failed","verdictNote":"forbidden pattern hit · missing \"insufficient evidence\", \"redacted\""}},"after":{"title":"MEASURED — compressed × Q9, an omission","view":{"type":"receipt","mode":"compressed","question":"Q9 · summarize M-2001's history","layers":[{"label":"System","tokens":65},{"label":"Retrieved","tokens":120},{"label":"Tool results","tokens":0},{"label":"History","tokens":0},{"label":"Your turn","tokens":23}],"inputTotal":208,"output":26,"cost":"$0.001014","cacheRead":"0%","verdict":"failed","verdictNote":"missing: PA-1004 · MANUAL_REVIEW"}}}},{"title":"Lines 3, 4 and 5 — truth, freshness, provenance","narrative":["<b>Line 3 · truth.</b> Both abstention traps were answered correctly by the router at <b>157 and 152 tokens</b>: a refusal that names the redaction on Q7, and a refusal that says no such note exists on Q8. Abstention-correct is reported next to tokens and never instead of them — a gate tuned too tight refuses questions it could have answered, and that shows up here too.","<b>Line 4 · freshness.</b> The contract gate verified 10 determinations before the campaign started, and the reconciler found <b>0 layer-sum drifts and 0 instrument disagreements across 100 cells</b>. Both timestamps go on the card: a number is only as fresh as the last gate that ran before it.","<b>Line 5
